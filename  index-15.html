<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Tracker - Calendar V15</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0b0f14;color:#f5f7fa;font-family:Arial,"Noto Sans Thai",sans-serif}
body{min-height:100vh}
.container{width:100%;max-width:900px;margin:auto;padding:22px}
.header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,#b8ff63,#65e56c);color:#071008;display:flex;align-items:center;justify-content:center;font-size:43px;font-weight:900;box-shadow:0 12px 35px rgba(100,230,100,.16)}
.brand h1{margin:0;font-size:36px}
.brand p{margin:5px 0 0;color:#818b99;font-size:18px}
.profile{width:58px;height:58px;border:1px solid #303844;border-radius:50%;background:#171e27;font-size:25px}
.target{padding:25px;border:1px solid #252c35;border-radius:27px;background:#10161e;margin-bottom:22px}
.target-top{display:flex;justify-content:space-between;gap:20px}
.target-label{font-size:16px;letter-spacing:3px;color:#858f9e;font-weight:800}
.target-title{margin-top:8px;font-size:26px;font-weight:800}
.target-value{text-align:right;font-size:32px;font-weight:900}
.target-percent{text-align:right;margin-top:4px;color:#8d96a3;font-size:18px}
.progress{height:10px;background:#18231f;border-radius:20px;margin:24px 0 16px;overflow:visible}
.progress-fill{height:100%;width:100%;background:linear-gradient(90deg,#2bd783,#8af0ba);border-radius:20px;position:relative}
.progress-dot{position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:20px;height:20px;border:4px solid #164f3c;border-radius:50%;background:#32dd8b;box-shadow:0 0 0 6px rgba(50,221,139,.12)}
.target-bottom{display:flex;justify-content:space-between;color:#8a94a2;font-size:18px}
.target-bottom strong{color:#e7ebf0}
.over{color:#35d982!important}
.calendar-card{padding:20px;background:#10151c;border:1px solid #252c35;border-radius:28px;box-shadow:0 15px 40px rgba(0,0,0,.25)}
.calendar-header{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;gap:12px;padding-bottom:20px;border-bottom:1px solid #222831}
.calendar-nav{width:72px;height:72px;border:1px solid #343c48;border-radius:20px;background:#202731;color:#fff;font-size:40px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.calendar-nav:active{transform:scale(.94)}
.calendar-title{text-align:center}
.calendar-title h2{margin:0;font-size:34px;font-weight:800}
.calendar-title p{margin:7px 0 0;font-size:17px;color:#858d9a}
.weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.weekdays{margin-top:18px;margin-bottom:8px}
.weekday{height:38px;display:flex;align-items:center;justify-content:center;color:#737c8b;font-size:16px;font-weight:700}
.calendar-day{position:relative;min-width:0;height:116px;padding:10px;border:1px solid #252c35;border-radius:19px;background:#151a21;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:transform .15s,border-color .15s,background .15s}
.calendar-day:hover{transform:translateY(-1px);border-color:#3a4350}
.calendar-day.empty{background:transparent;border-color:transparent;cursor:default}
.calendar-day.empty:hover{transform:none}
.day-number{width:100%;text-align:center;font-size:27px;line-height:1.1;font-weight:800;color:#f5f7fa;margin-top:2px}
.day-amount{width:100%;margin-top:12px;text-align:center;font-size:20px;line-height:1.1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-amount.positive{color:#35d982}.day-amount.negative{color:#ff626c}
.calendar-day.no-data{justify-content:center}
.calendar-day.positive{background:linear-gradient(145deg,rgba(29,145,91,.15),rgba(18,43,35,.45));border-color:#168d5d}
.calendar-day.negative{background:linear-gradient(145deg,rgba(130,38,50,.18),rgba(48,24,30,.45));border-color:#9e3948}
.calendar-day.today{box-shadow:0 0 0 2px rgba(93,137,255,.75),0 0 18px rgba(73,112,255,.15)}
.day-dots{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:7px}
.day-dot{width:9px;height:9px;border-radius:50%}
.day-dot.income{background:#35d982}.day-dot.expense{background:#ff626c}
.calendar-legend{display:flex;justify-content:center;align-items:center;gap:28px;margin-top:24px;color:#858d99;font-size:15px}
.legend-item{display:flex;align-items:center;gap:8px}.legend-dot{width:11px;height:11px;border-radius:50%}
.legend-dot.green{background:#35d982}.legend-dot.red{background:#ff626c}.legend-dot.blue{background:#3689ff}
.day-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}
.day-modal.show{display:flex}
.day-modal-box{width:100%;max-width:520px;max-height:85vh;overflow-y:auto;padding:24px;background:#151a21;border:1px solid #303844;border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.day-modal-header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}
.day-modal-title{margin:0;font-size:25px;font-weight:800}
.day-modal-close{width:44px;height:44px;border:0;border-radius:14px;background:#252c36;color:#fff;font-size:25px;cursor:pointer}
.day-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px}
.day-summary-card{padding:14px;border-radius:15px;background:#0e1319;text-align:center}
.day-summary-card small{display:block;color:#777f8c;font-size:12px}
.day-summary-card strong{display:block;margin-top:5px;font-size:17px}
.day-summary-income{color:#35d982}.day-summary-expense{color:#ff626c}
.detail-item{padding:15px;margin-bottom:9px;border-radius:15px;background:#0e1319;border:1px solid #222933}
.detail-top{display:flex;justify-content:space-between;gap:10px}
.detail-name{font-weight:700;color:#fff}.detail-amount{font-weight:800;white-space:nowrap}
.detail-meta{margin-top:6px;color:#737c89;font-size:13px}
.detail-income{color:#35d982}.detail-expense{color:#ff626c}
.no-detail{padding:30px;text-align:center;color:#737c89}
@media(max-width:600px){
.container{padding:14px}
.brand{gap:12px}.logo{width:64px;height:64px;border-radius:19px;font-size:36px}.brand h1{font-size:30px}.brand p{font-size:15px}.profile{width:52px;height:52px}
.target{padding:20px;border-radius:23px}.target-title{font-size:22px}.target-value{font-size:27px}.target-bottom{font-size:15px}
.calendar-card{padding:14px;border-radius:23px}.calendar-header{grid-template-columns:58px 1fr 58px;gap:8px}.calendar-nav{width:58px;height:58px;border-radius:17px;font-size:32px}.calendar-title h2{font-size:27px}.calendar-title p{font-size:14px}
.weekdays,.calendar-grid{gap:5px}.calendar-day{height:112px;padding:7px;border-radius:17px}.day-number{font-size:25px}.day-amount{margin-top:11px;font-size:18px}.day-dots{bottom:8px;gap:5px}.day-dot{width:8px;height:8px}.calendar-legend{gap:15px;font-size:13px}
}
@media(max-width:390px){
.calendar-card{padding:10px}.calendar-day{height:103px;border-radius:15px}.day-number{font-size:22px}.day-amount{font-size:16px;margin-top:9px}.weekday{font-size:13px}
}
</style>
</head>
<body>
<div class="container">

<header class="header">
  <div class="brand">
    <div class="logo">฿</div>
    <div>
      <h1>Money Tracker</h1>
      <p>จัดการรายรับรายจ่ายของคุณ</p>
    </div>
  </div>
  <button class="profile" type="button">👤</button>
</header>

<section class="target">
  <div class="target-top">
    <div>
      <div class="target-label">MONTHLY TARGET</div>
      <div class="target-title">เป้าหมายรายรับเดือนนี้</div>
    </div>
    <div>
      <div class="target-value" id="targetCurrent">฿0</div>
      <div class="target-percent" id="targetPercent">0%</div>
    </div>
  </div>
  <div class="progress">
    <div class="progress-fill" id="targetProgress">
      <span class="progress-dot"></span>
    </div>
  </div>
  <div class="target-bottom">
    <span id="targetOver">฿0</span>
    <strong>฿11,000 TARGET</strong>
  </div>
</section>

<section class="calendar-card">
  <div class="calendar-header">
    <button class="calendar-nav" type="button" onclick="calendarPreviousMonth()">‹</button>
    <div class="calendar-title">
      <h2 id="calendarMonthText">สิงหาคม 2569</h2>
      <p>สรุปรายรับ / รายจ่ายรายวัน</p>
    </div>
    <button class="calendar-nav" type="button" onclick="calendarNextMonth()">›</button>
  </div>

  <div class="weekdays">
    <div class="weekday">อา</div><div class="weekday">จ</div><div class="weekday">อ</div>
    <div class="weekday">พ</div><div class="weekday">พฤ</div><div class="weekday">ศ</div><div class="weekday">ส</div>
  </div>

  <div id="calendarGrid" class="calendar-grid"></div>

  <div class="calendar-legend">
    <div class="legend-item"><span class="legend-dot green"></span><span>สุทธิบวก</span></div>
    <div class="legend-item"><span class="legend-dot red"></span><span>สุทธิลบ</span></div>
    <div class="legend-item"><span class="legend-dot blue"></span><span>วันนี้</span></div>
  </div>
</section>

</div>

<div id="dayModal" class="day-modal" onclick="closeDayModal(event)">
  <div class="day-modal-box" onclick="event.stopPropagation()">
    <div class="day-modal-header">
      <h3 id="dayModalTitle" class="day-modal-title">รายละเอียด</h3>
      <button class="day-modal-close" type="button" onclick="hideDayModal()">×</button>
    </div>
    <div id="daySummary" class="day-summary"></div>
    <div id="dayTransactions"></div>
  </div>
</div>

<script>
const TARGET=11000;
let calendarMonth=new Date();
calendarMonth.setDate(1);
let calendarTransactions=[];

const thaiMonths=[
"มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
"กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"
];

function money(v){
 return "฿"+Number(v||0).toLocaleString("th-TH",{maximumFractionDigits:2});
}

function dateKey(y,m,d){
 return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}

function todayKey(){
 const d=new Date();
 return dateKey(d.getFullYear(),d.getMonth(),d.getDate());
}

function updateMonthText(){
 const m=calendarMonth.getMonth();
 const y=calendarMonth.getFullYear()+543;
 document.getElementById("calendarMonthText").textContent=thaiMonths[m]+" "+y;
}

function calendarPreviousMonth(){
 calendarMonth.setMonth(calendarMonth.getMonth()-1);
 renderCalendar();
}

function calendarNextMonth(){
 calendarMonth.setMonth(calendarMonth.getMonth()+1);
 renderCalendar();
}

function buildDailyData(){
 const result={};
 calendarTransactions.forEach(t=>{
   if(!t.transaction_date)return;
   const key=String(t.transaction_date).slice(0,10);
   if(!result[key])result[key]={income:0,expense:0,transactions:[]};
   const amount=Number(t.amount||0);
   if(t.type==="income")result[key].income+=amount;
   else result[key].expense+=amount;
   result[key].transactions.push(t);
 });
 return result;
}

function renderCalendar(){
 updateMonthText();
 const grid=document.getElementById("calendarGrid");
 if(!grid)return;
 grid.innerHTML="";
 const y=calendarMonth.getFullYear();
 const m=calendarMonth.getMonth();
 const first=new Date(y,m,1).getDay();
 const days=new Date(y,m+1,0).getDate();
 const daily=buildDailyData();

 for(let i=0;i<first;i++){
   const e=document.createElement("div");
   e.className="calendar-day empty";
   grid.appendChild(e);
 }

 for(let day=1;day<=days;day++){
   const key=dateKey(y,m,day);
   const data=daily[key]||{income:0,expense:0,transactions:[]};
   const net=data.income-data.expense;

   const cell=document.createElement("div");
   cell.className="calendar-day";

   if(!data.income&&!data.expense)cell.classList.add("no-data");
   if(net>0)cell.classList.add("positive");
   if(net<0)cell.classList.add("negative");
   if(key===todayKey())cell.classList.add("today");

   const number=document.createElement("div");
   number.className="day-number";
   number.textContent=day;
   cell.appendChild(number);

   if(data.income||data.expense){
     const amount=document.createElement("div");
     amount.className="day-amount "+(net>=0?"positive":"negative");
     amount.textContent=(net>=0?"+":"-")+money(Math.abs(net));
     cell.appendChild(amount);

     const dots=document.createElement("div");
     dots.className="day-dots";

     if(data.income){
       const d=document.createElement("span");
       d.className="day-dot income";
       dots.appendChild(d);
     }
     if(data.expense){
       const d=document.createElement("span");
       d.className="day-dot expense";
       dots.appendChild(d);
     }
     cell.appendChild(dots);
   }

   cell.addEventListener("click",()=>openDayDetail(key,day,data));
   grid.appendChild(cell);
 }

 const remainder=(first+days)%7;
 if(remainder){
   for(let i=remainder;i<7;i++){
     const e=document.createElement("div");
     e.className="calendar-day empty";
     grid.appendChild(e);
   }
 }
}

function openDayDetail(key,day,data){
 const modal=document.getElementById("dayModal");
 const date=new Date(key+"T00:00:00");
 const title=document.getElementById("dayModalTitle");
 title.textContent=day+" "+thaiMonths[date.getMonth()]+" "+(date.getFullYear()+543);

 const net=data.income-data.expense;

 document.getElementById("daySummary").innerHTML=`
 <div class="day-summary-card"><small>รายรับ</small><strong class="day-summary-income">${money(data.income)}</strong></div>
 <div class="day-summary-card"><small>รายจ่าย</small><strong class="day-summary-expense">${money(data.expense)}</strong></div>
 <div class="day-summary-card"><small>คงเหลือ</small><strong class="${net>=0?"day-summary-income":"day-summary-expense"}">${net>=0?"+":"-"}${money(Math.abs(net))}</strong></div>`;

 const list=document.getElementById("dayTransactions");
 list.innerHTML="";

 if(!data.transactions.length){
   list.innerHTML='<div class="no-detail">ไม่มีรายการในวันนี้</div>';
 }else{
   data.transactions.forEach(item=>{
     const income=item.type==="income";
     const div=document.createElement("div");
     div.className="detail-item";
     div.innerHTML=`
       <div class="detail-top">
         <div class="detail-name">${escapeHtml(item.description||item.category||"ไม่มีรายละเอียด")}</div>
         <div class="detail-amount ${income?"detail-income":"detail-expense"}">${income?"+":"-"}${money(item.amount)}</div>
       </div>
       <div class="detail-meta">${escapeHtml(item.category||"อื่น ๆ")}</div>`;
     list.appendChild(div);
   });
 }
 modal.classList.add("show");
}

function escapeHtml(value){
 return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function hideDayModal(){
 document.getElementById("dayModal").classList.remove("show");
}

function closeDayModal(e){
 if(e.target.id==="dayModal")hideDayModal();
}

function renderCalendarFromTransactions(data){
 calendarTransactions=Array.isArray(data)?data:[];
 renderCalendar();
 updateTarget();
}

function updateTarget(){
 const income=calendarTransactions
   .filter(t=>t.type==="income")
   .reduce((s,t)=>s+Number(t.amount||0),0);

 const percent=(income/TARGET)*100;
 document.getElementById("targetCurrent").textContent=money(income);
 document.getElementById("targetPercent").textContent=percent.toFixed(1)+"%";

 const over=income-TARGET;
 const overEl=document.getElementById("targetOver");
 overEl.textContent=money(Math.abs(over))+(over>=0?" OVER TARGET":" REMAINING");
 overEl.className=over>=0?"over":"";

 document.getElementById("targetProgress").style.width=Math.min(percent,100)+"%";
}

renderCalendar();
updateTarget();

/*
  ถ้ามี Supabase อยู่ในไฟล์เดิม:
  หลัง query transactions สำเร็จ ให้เรียก:
  renderCalendarFromTransactions(data);

  ตัวอย่าง:
  const { data, error } = await db.from("transactions").select("*");
  if(!error) renderCalendarFromTransactions(data);
*/
</script>
</body>
</html>
