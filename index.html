<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Money Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #222222;
    --muted: #777777;
    --border: #eeeeee;
    --input: #ffffff;
    --button: #111111;
    --button-text: #ffffff;
    --green: #16803c;
    --red: #d62828;
    --bar-bg: #eeeeee;
}

body.dark {
    --bg: #111315;
    --card: #1b1e21;
    --text: #f1f1f1;
    --muted: #999999;
    --border: #2d3135;
    --input: #24282c;
    --button: #f1f1f1;
    --button-text: #111111;
    --bar-bg: #33383d;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    transition: background 0.2s, color 0.2s;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

h1 {
    margin: 10px 0 20px;
    font-size: 32px;
}

h2 {
    margin-top: 25px;
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.header h1 {
    margin: 0;
}

.theme-btn {
    width: 45px;
    height: 45px;
    border: 0;
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    font-size: 21px;
}

/* MONTH */

.month {
    background: var(--card);
    border-radius: 14px;
    padding: 12px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 15px;
}

.month button {
    width: 45px;
    height: 42px;

    border: 0;
    border-radius: 10px;

    background: var(--border);
    color: var(--text);

    font-size: 24px;
}

#monthText {
    font-weight: bold;
    font-size: 18px;
}

/* SUMMARY */

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.card {
    background: var(--card);
    padding: 15px;
    border-radius: 14px;
}

.card small {
    color: var(--muted);
}

.card strong {
    display: block;
    margin-top: 8px;
    font-size: 19px;
}

.green {
    color: var(--green);
}

.red {
    color: var(--red);
}

/* BUTTON */

.add {
    width: 100%;

    padding: 15px;
    margin-top: 15px;

    border: 0;
    border-radius: 12px;

    background: var(--button);
    color: var(--button-text);

    font-size: 16px;
}

/* FORM */

.form {
    display: none;

    background: var(--card);

    padding: 18px;

    border-radius: 14px;

    margin-top: 15px;
}

label {
    display: block;

    margin-top: 12px;
    margin-bottom: 5px;

    font-size: 14px;
}

input,
select {
    width: 100%;

    padding: 12px;

    border: 1px solid var(--border);

    border-radius: 10px;

    font-size: 16px;

    background: var(--input);
    color: var(--text);
}

.custom-category {
    display: none;
}

.save {
    width: 100%;

    margin-top: 18px;

    padding: 13px;

    border: 0;
    border-radius: 10px;

    background: var(--green);
    color: white;

    font-size: 16px;
}

.cancel {
    width: 100%;

    margin-top: 8px;

    padding: 13px;

    border: 0;
    border-radius: 10px;

    background: var(--border);
    color: var(--text);

    font-size: 16px;
}

/* CARD */

.analysis,
.chart-card {
    background: var(--card);

    border-radius: 14px;

    padding: 18px;

    margin-top: 20px;
}

.analysis-title,
.chart-title {
    font-weight: bold;

    font-size: 18px;

    margin-bottom: 15px;
}

/* CATEGORY */

.category {
    margin-bottom: 15px;
}

.category-top {
    display: flex;

    justify-content: space-between;

    margin-bottom: 6px;

    font-size: 14px;
}

.bar-bg {
    height: 8px;

    background: var(--bar-bg);

    border-radius: 20px;

    overflow: hidden;
}

.bar {
    height: 100%;

    background: var(--text);

    border-radius: 20px;
}

/* CHART */

.chart {
    height: 210px;

    display: flex;

    align-items: flex-end;

    gap: 8px;

    padding-top: 25px;
}

.chart-column {
    flex: 1;

    height: 100%;

    display: flex;

    flex-direction: column;

    justify-content: flex-end;

    align-items: center;
}

.chart-bars {
    width: 100%;

    height: 160px;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    gap: 4px;
}

.chart-bar {
    width: 16px;

    min-height: 2px;

    border-radius: 5px 5px 0 0;
}

.chart-income {
    background: var(--green);
}

.chart-expense {
    background: var(--red);
}

.chart-label {
    margin-top: 7px;

    font-size: 11px;

    color: var(--muted);
}

.chart-legend {
    display: flex;

    justify-content: center;

    gap: 18px;

    margin-top: 12px;

    font-size: 13px;
}

.legend-income::before {
    content: "●";

    color: var(--green);

    margin-right: 5px;
}

.legend-expense::before {
    content: "●";

    color: var(--red);

    margin-right: 5px;
}

/* TRANSACTIONS */

.transaction {
    background: var(--card);

    padding: 15px;

    border-radius: 13px;

    margin-bottom: 10px;
}

.transaction-main {
    display: flex;

    justify-content: space-between;

    gap: 10px;
}

.transaction-name {
    font-weight: bold;
}

.transaction-detail {
    color: var(--muted);

    font-size: 14px;

    margin-top: 5px;
}

.transaction-amount {
    font-weight: bold;

    white-space: nowrap;
}

.actions {
    display: flex;

    gap: 8px;

    margin-top: 12px;

    padding-top: 10px;

    border-top: 1px solid var(--border);
}

.edit,
.delete {
    flex: 1;

    padding: 9px;

    border: 0;

    border-radius: 9px;
}

.edit {
    background: var(--border);
    color: var(--text);
}

.delete {
    background: #ffe5e5;
    color: #c62828;
}

.center {
    text-align: center;

    color: var(--muted);

    padding: 25px;
}

/* MOBILE */

@media (max-width: 450px) {

    .summary {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 30px;
    }

    .chart-bars {
        gap: 2px;
    }

    .chart-bar {
        width: 12px;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>💰 Money Tracker</h1>

        <button
            class="theme-btn"
            onclick="toggleTheme()"
            id="themeButton">

            🌙

        </button>

    </div>


    <!-- MONTH -->

    <div class="month">

        <button onclick="previousMonth()">
            ‹
        </button>

        <div id="monthText">
            กำลังโหลด...
        </div>

        <button onclick="nextMonth()">
            ›
        </button>

    </div>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="card">

            <small>
                รายรับ
            </small>

            <strong
                id="income"
                class="green">

                ฿0

            </strong>

        </div>


        <div class="card">

            <small>
                รายจ่าย
            </small>

            <strong
                id="expense"
                class="red">

                ฿0

            </strong>

        </div>


        <div class="card">

            <small>
                คงเหลือ
            </small>

            <strong id="balance">

                ฿0

            </strong>

        </div>

    </div>


    <!-- ADD -->

    <button
        class="add"
        onclick="openForm()">

        ＋ เพิ่มรายการ

    </button>


    <!-- FORM -->

    <div
        class="form"
        id="form">

        <h2 id="formTitle">
            เพิ่มรายการ
        </h2>


        <label>
            ประเภท
        </label>

        <select id="type">

            <option value="income">
                รายรับ
            </option>

            <option value="expense">
                รายจ่าย
            </option>

        </select>


        <label>
            จำนวนเงิน
        </label>

        <input
            id="amount"
            type="number"
            min="0"
            step="0.01"
            placeholder="เช่น 500"
        >


        <label>
            หมวดหมู่
        </label>

        <select
            id="category"
            onchange="categoryChanged()">

        </select>


        <div
            class="custom-category"
            id="customCategoryBox">

            <label>
                ชื่อหมวดหมู่ใหม่
            </label>

            <input
                id="customCategory"
                type="text"
                placeholder="เช่น ค่าอินเทอร์เน็ต"
            >

        </div>


        <label>
            รายละเอียด
        </label>

        <input
            id="description"
            type="text"
            placeholder="เช่น ขายไอเทม"
        >


        <label>
            วันที่
        </label>

        <input
            id="date"
            type="date"
        >


        <button
            class="save"
            onclick="save()">

            บันทึก

        </button>


        <button
            class="cancel"
            onclick="closeForm()">

            ยกเลิก

        </button>

    </div>


    <!-- 6 MONTH CHART -->

    <div class="chart-card">

        <div class="chart-title">
            📈 ภาพรวม 6 เดือน
        </div>

        <div id="chart">

            <div class="center">
                กำลังโหลด...
            </div>

        </div>

        <div class="chart-legend">

            <span class="legend-income">
                รายรับ
            </span>

            <span class="legend-expense">
                รายจ่าย
            </span>

        </div>

    </div>


    <!-- EXPENSE -->

    <div class="analysis">

        <div class="analysis-title">
            📊 สรุปรายจ่ายตามหมวด
        </div>

        <div id="expenseAnalysis">

            <div class="center">
                ยังไม่มีรายจ่าย
            </div>

        </div>

    </div>


    <!-- INCOME -->

    <div class="analysis">

        <div class="analysis-title">
            💰 สรุปรายรับตามหมวด
        </div>

        <div id="incomeAnalysis">

            <div class="center">
                ยังไม่มีรายรับ
            </div>

        </div>

    </div>


    <!-- TRANSACTIONS -->

    <h2>
        รายการในเดือนนี้
    </h2>

    <div id="transactions">

        <div class="center">
            กำลังโหลด...
        </div>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://sbiziifpybyzljikjnrh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aD38PwfPHzSYU83kIbmnEg_rHVMgomF";

const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   STATE
========================= */

let currentMonth =
    new Date();

currentMonth.setDate(1);

let editingId = null;

let allCategories = [];


/* =========================
   DEFAULT CATEGORIES
========================= */

const defaultCategories = [

    "อาหาร",
    "เดินทาง",
    "เกม",
    "Roblox",
    "ซื้อของ",
    "เงินเดือน",
    "อื่น ๆ"

];


/* =========================
   MONTH
========================= */

const months = [

    "มกราคม",
    "กุมภาพันธ์",
    "มีนาคม",
    "เมษายน",
    "พฤษภาคม",
    "มิถุนายน",
    "กรกฎาคม",
    "สิงหาคม",
    "กันยายน",
    "ตุลาคม",
    "พฤศจิกายน",
    "ธันวาคม"

];


function showMonth() {

    const name =
        months[
            currentMonth.getMonth()
        ];

    const year =
        currentMonth.getFullYear()
        + 543;

    document.getElementById(
        "monthText"
    ).textContent =
        name + " " + year;
}


function previousMonth() {

    currentMonth.setMonth(
        currentMonth.getMonth() - 1
    );

    showMonth();

    load();

}


function nextMonth() {

    currentMonth.setMonth(
        currentMonth.getMonth() + 1
    );

    showMonth();

    load();

}


/* =========================
   MONTH RANGE
========================= */

function monthRange(date) {

    const year =
        date.getFullYear();

    const month =
        date.getMonth();


    const start =
        year +
        "-" +
        String(month + 1)
            .padStart(2, "0") +
        "-01";


    const next =
        new Date(
            year,
            month + 1,
            1
        );


    const end =
        next.getFullYear() +
        "-" +
        String(
            next.getMonth() + 1
        ).padStart(2, "0") +
        "-01";


    return {
        start,
        end
    };

}


/* =========================
   THEME
========================= */

function loadTheme() {

    const saved =
        localStorage.getItem(
            "money-theme"
        );


    if (saved === "dark") {

        document.body.classList.add(
            "dark"
        );

        document.getElementById(
            "themeButton"
        ).textContent = "☀️";

    }

}


function toggleTheme() {

    const dark =
        document.body.classList.toggle(
            "dark"
        );


    localStorage.setItem(
        "money-theme",
        dark ? "dark" : "light"
    );


    document.getElementById(
        "themeButton"
    ).textContent =
        dark
            ? "☀️"
            : "🌙";

}


/* =========================
   LOGIN
========================= */

async function login() {

    const session =
        await db.auth.getSession();


    if (session.data.session) {

        return true;

    }


    const result =
        await db.auth
            .signInAnonymously();


    if (result.error) {

        alert(
            "Login ไม่สำเร็จ: " +
            result.error.message
        );

        return false;

    }


    return true;

}


/* =========================
   LOAD CATEGORIES
========================= */

async function loadCategories() {

    const result =
        await db
            .from("transactions")
            .select("category");


    if (result.error) {

        console.error(
            result.error
        );

        allCategories =
            [...defaultCategories];

    } else {

        const fromDatabase =
            (result.data || [])
                .map(
                    item =>
                        item.category
                )
                .filter(
                    Boolean
                );


        allCategories =
            [
                ...new Set([
                    ...defaultCategories,
                    ...fromDatabase
                ])
            ];

    }


    renderCategorySelect();

}


/* =========================
   CATEGORY SELECT
========================= */

function renderCategorySelect(
    selected = ""
) {

    const select =
        document.getElementById(
            "category"
        );


    select.innerHTML = "";


    allCategories.forEach(
        category => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                category;

            option.textContent =
                category;

            select.appendChild(
                option
            );

        }
    );


    const custom =
        document.createElement(
            "option"
        );

    custom.value =
        "__custom__";

    custom.textContent =
        "＋ เพิ่มหมวดหมู่ใหม่";

    select.appendChild(
        custom
    );


    if (selected) {

        if (
            allCategories.includes(
                selected
            )
        ) {

            select.value =
                selected;

        } else {

            select.value =
                "__custom__";

            document.getElementById(
                "customCategory"
            ).value =
                selected;

            categoryChanged();

        }

    }

}


function categoryChanged() {

    const value =
        document.getElementById(
            "category"
        ).value;


    const box =
        document.getElementById(
            "customCategoryBox"
        );


    if (value === "__custom__") {

        box.style.display =
            "block";

    } else {

        box.style.display =
            "none";

    }

}


/* =========================
   FORM
========================= */

function openForm() {

    editingId = null;


    document.getElementById(
        "formTitle"
    ).textContent =
        "เพิ่มรายการ";


    document.getElementById(
        "type"
    ).value =
        "income";


    document.getElementById(
        "amount"
    ).value =
        "";


    document.getElementById(
        "description"
    ).value =
        "";


    document.getElementById(
        "customCategory"
    ).value =
        "";


    renderCategorySelect();


    setToday();


    document.getElementById(
        "form"
    ).style.display =
        "block";

}


function closeForm() {

    document.getElementById(
        "form"
    ).style.display =
        "none";

    editingId = null;

}


function setToday() {

    const date =
        new Date();

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "date"
    ).value =
        year +
        "-" +
        month +
        "-" +
        day;

}


/* =========================
   SAVE
========================= */

async function save() {

    const type =
        document.getElementById(
            "type"
        ).value;


    const amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        );


    let category =
        document.getElementById(
            "category"
        ).value;


    const custom =
        document.getElementById(
            "customCategory"
        ).value.trim();


    if (
        category ===
        "__custom__"
    ) {

        category =
            custom;

    }


    const description =
        document.getElementById(
            "description"
        ).value.trim();


    const date =
        document.getElementById(
            "date"
        ).value;


    if (
        !amount ||
        amount <= 0
    ) {

        alert(
            "กรอกจำนวนเงินก่อน"
        );

        return;

    }


    if (!category) {

        alert(
            "กรอกหมวดหมู่ก่อน"
        );

        return;

    }


    if (!date) {

        alert(
            "เลือกวันที่ก่อน"
        );

        return;

    }


    const userResult =
        await db.auth.getUser();


    const user =
        userResult.data.user;


    if (!user) {

        alert(
            "ไม่พบ User"
        );

        return;

    }


    let result;


    if (editingId) {

        result =
            await db
                .from("transactions")
                .update({

                    type,
                    amount,
                    category,
                    description,
                    transaction_date:
                        date

                })
                .eq(
                    "id",
                    editingId
                )
                .eq(
                    "user_id",
                    user.id
                );

    } else {

        result =
            await db
                .from("transactions")
                .insert({

                    user_id:
                        user.id,

                    type,
                    amount,
                    category,
                    description,
                    transaction_date:
                        date

                });

    }


    if (result.error) {

        alert(
            "บันทึกไม่สำเร็จ: " +
            result.error.message
        );

        return;

    }


    closeForm();

    await load();

}


/* =========================
   LOAD CURRENT
