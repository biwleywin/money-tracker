<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#101214">
<title>Money Tracker</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#101214;color:#f1f1f1}
body{font-family:Arial,"Noto Sans Thai",sans-serif;overflow-x:hidden}
button,input,select{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.container{width:100%;max-width:600px;margin:0 auto;padding:18px}
h1{font-size:32px;margin:8px 0 20px;line-height:1.2}
h2{font-size:21px;margin:25px 0 12px}

.month{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    min-height:68px;
    padding:10px 12px;
    margin-bottom:15px;
    background:#1b1e22;
    border-radius:16px;
}
.month button{
    width:48px;height:46px;
    border:0;border-radius:12px;
    background:#30343a;color:#fff;
    font-size:27px;line-height:1;
}
.month button:active{transform:scale(.94)}
#monthText{font-size:18px;font-weight:700;text-align:center;min-width:130px}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:#1b1e22;border-radius:16px;padding:15px;min-width:0}
.card small{color:#999}
.card strong{display:block;margin-top:8px;font-size:19px;overflow-wrap:anywhere}
.green{color:#35c76f}.red{color:#ff5757}

.add{
    width:100%;margin-top:15px;padding:16px;
    border:0;border-radius:14px;
    background:#f1f1f1;color:#111;
    font-size:17px;font-weight:700;
}
.add:active{transform:scale(.98)}

.form{
    display:none;
    margin-top:15px;padding:18px;
    background:#1b1e22;border-radius:16px;
}
.form h2{margin:0 0 15px}
label{display:block;margin:12px 0 6px;color:#aaa;font-size:14px}
input,select{
    width:100%;padding:13px;
    border:1px solid #3a3f45;border-radius:11px;
    outline:none;background:#25292e;color:#f1f1f1;
    font-size:16px;
}
input:focus,select:focus{border-color:#777}
input::placeholder{color:#777}
.save,.cancel{
    width:100%;padding:13px;border:0;border-radius:11px;
    font-size:16px;font-weight:700;
}
.save{margin-top:18px;background:#16803c;color:#fff}
.cancel{margin-top:8px;background:#30343a;color:#fff}
.save:disabled{opacity:.6;cursor:wait}

.filters{
    margin-top:20px;padding:16px;
    background:#1b1e22;border-radius:16px;
}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filter-reset{
    width:100%;margin-top:10px;padding:10px;
    border:0;border-radius:10px;
    background:#30343a;color:#fff;
}
.result-count{margin-top:11px;color:#888;font-size:13px}

.analysis{
    margin-top:20px;padding:18px;
    background:#1b1e22;border-radius:16px;
}
.analysis-title{font-size:18px;font-weight:700;margin-bottom:15px}
.category{margin-bottom:15px}
.category-top{
    display:flex;justify-content:space-between;gap:10px;
    margin-bottom:6px;font-size:14px
}
.bar-bg{height:8px;background:#30343a;border-radius:20px;overflow:hidden}
.bar{height:100%;background:#f1f1f1;border-radius:20px}

.transaction{
    margin-bottom:10px;padding:15px;
    background:#1b1e22;border-radius:14px;
}
.transaction-main{display:flex;justify-content:space-between;gap:12px}
.transaction-left{min-width:0}
.transaction-name{font-weight:700;overflow-wrap:anywhere}
.transaction-detail{margin-top:5px;color:#999;font-size:14px;overflow-wrap:anywhere}
.transaction-amount{flex-shrink:0;font-weight:700;white-space:nowrap}
.actions{
    display:flex;gap:8px;
    margin-top:12px;padding-top:10px;
    border-top:1px solid #30343a
}
.edit,.delete{
    flex:1;padding:10px;border:0;border-radius:10px
}
.edit{background:#30343a;color:#fff}
.delete{background:#4a2525;color:#ff6b6b}

.center{text-align:center;color:#999;padding:25px}
.error{
    margin-top:15px;padding:15px;
    background:#3a2020;border-radius:12px;
    color:#ff7777;word-break:break-word
}
.status{
    margin-top:10px;
    color:#777;
    font-size:12px;
    text-align:center
}

@media(max-width:450px){
    .container{padding:15px}
    h1{font-size:30px}
    .summary{grid-template-columns:1fr}
    .filter-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="container">

    <h1>💰 Money Tracker</h1>

    <!-- เดือนมีค่าเริ่มต้นตั้งแต่ HTML
         ไม่ต้องรอ JavaScript หรือ Supabase -->
    <div class="month">
        <button type="button" onclick="previousMonth()">‹</button>
        <div id="monthText">สิงหาคม 2569</div>
        <button type="button" onclick="nextMonth()">›</button>
    </div>

    <div class="summary">
        <div class="card">
            <small>รายรับ</small>
            <strong id="income" class="green">฿0</strong>
        </div>
        <div class="card">
            <small>รายจ่าย</small>
            <strong id="expense" class="red">฿0</strong>
        </div>
        <div class="card">
            <small>คงเหลือ</small>
            <strong id="balance">฿0</strong>
        </div>
    </div>

    <!-- ปุ่มนี้ใช้ inline onclick
         จึงไม่ต้องรอ Supabase -->
    <button class="add" type="button" onclick="openForm()">
        ＋ เพิ่มรายการ
    </button>

    <div id="form" class="form">
        <h2 id="formTitle">เพิ่มรายการ</h2>

        <label>ประเภท</label>
        <select id="type">
            <option value="income">รายรับ</option>
            <option value="expense">รายจ่าย</option>
        </select>

        <label>จำนวนเงิน</label>
        <input id="amount" type="number" min="0" step="0.01"
               inputmode="decimal" placeholder="เช่น 500">

        <label>หมวดหมู่</label>
        <select id="category">
            <option value="Food">อาหาร</option>
            <option value="Transport">เดินทาง</option>
            <option value="Gaming">เกม</option>
            <option value="Roblox">Roblox</option>
            <option value="Shopping">ซื้อของ</option>
            <option value="Salary">เงินเดือน</option>
            <option value="Other">อื่น ๆ</option>
        </select>

        <label>รายละเอียด</label>
        <input id="description" type="text" maxlength="200"
               placeholder="เช่น ขายไอเทม">

        <label>วันที่</label>
        <input id="date" type="date">

        <button id="saveButton" class="save" type="button"
                onclick="saveTransaction()">บันทึก</button>

        <button class="cancel" type="button"
                onclick="closeForm()">ยกเลิก</button>
    </div>

    <div class="filters">
        <input id="search" type="search"
               placeholder="🔎 ค้นหารายการ..."
               autocomplete="off">

        <div class="filter-grid" style="margin-top:10px">
            <select id="typeFilter">
                <option value="all">ทุกประเภท</option>
                <option value="income">รายรับ</option>
                <option value="expense">รายจ่าย</option>
            </select>

            <select id="categoryFilter">
                <option value="all">ทุกหมวด</option>
                <option value="Food">อาหาร</option>
                <option value="Transport">เดินทาง</option>
                <option value="Gaming">เกม</option>
                <option value="Roblox">Roblox</option>
                <option value="Shopping">ซื้อของ</option>
                <option value="Salary">เงินเดือน</option>
                <option value="Other">อื่น ๆ</option>
            </select>
        </div>

        <label>เรียงรายการ</label>
        <select id="sort">
            <option value="date_desc">ใหม่ → เก่า</option>
            <option value="date_asc">เก่า → ใหม่</option>
            <option value="amount_desc">จำนวนเงินมาก → น้อย</option>
            <option value="amount_asc">จำนวนเงินน้อย → มาก</option>
        </select>

        <button id="resetButton" class="filter-reset"
                type="button" onclick="resetFilters()">รีเซ็ตตัวกรอง</button>

        <div id="resultCount" class="result-count">0 รายการ</div>
    </div>

    <div class="analysis">
        <div class="analysis-title">📊 สรุปรายจ่ายตามหมวด</div>
        <div id="expenseAnalysis">
            <div class="center">ยังไม่มีรายจ่าย</div>
        </div>
    </div>

    <div class="analysis">
        <div class="analysis-title">💰 สรุปรายรับตามหมวด</div>
        <div id="incomeAnalysis">
            <div class="center">ยังไม่มีรายรับ</div>
        </div>
    </div>

    <h2>รายการในเดือนนี้</h2>
    <div id="transactions">
        <div class="center">กำลังเชื่อมต่อฐานข้อมูล...</div>
    </div>

    <div id="status" class="status"></div>
</div>

<!-- โหลด Supabase หลัง HTML -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* =========================================================
   MONEY TRACKER V6
   จุดสำคัญ:
   - UI ใช้งานได้โดยไม่ต้องรอ Supabase
   - เดือนมีค่าเริ่มต้นจาก HTML
   - ปุ่มเพิ่มรายการใช้ onclick ตรง
   - Supabase มีหน้าที่เฉพาะข้อมูล
========================================================= */

var SUPABASE_URL =
    "https://sbiziifpybyzljikjnrh.supabase.co";

var SUPABASE_KEY =
    "sb_publishable_aD38PwfPHzSYU83kIbmnEg_rHVMgomF";

var db = null;
var currentMonth = new Date();
currentMonth.setDate(1);

var allTransactions = [];
var editingId = null;
var databaseReady = false;
var loadingNumber = 0;

var monthNames = [
    "มกราคม","กุมภาพันธ์","มีนาคม","เมษายน",
    "พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม",
    "กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"
];

/* =========================================================
   BASIC HELPERS
========================================================= */

function $(id) {
    return document.getElementById(id);
}

function updateMonthText() {
    var name = monthNames[currentMonth.getMonth()];
    var year = currentMonth.getFullYear() + 543;
    $("monthText").textContent = name + " " + year;
}

function getToday() {
    var d = new Date();

    return d.getFullYear() + "-" +
        String(d.getMonth() + 1).padStart(2, "0") + "-" +
        String(d.getDate()).padStart(2, "0");
}

function money(value) {
    return Number(value || 0).toLocaleString("th-TH", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
    });
}

function categoryName(value) {
    var names = {
        Food: "อาหาร",
        Transport: "เดินทาง",
        Gaming: "เกม",
        Roblox: "Roblox",
        Shopping: "ซื้อของ",
        Salary: "เงินเดือน",
        Other: "อื่น ๆ"
    };

    return names[value] || value || "อื่น ๆ";
}

function formatDate(value) {
    if (!value) return "-";

    var p = String(value).split("-");

    if (p.length !== 3) return value;

    return p[2] + "/" + p[1] + "/" + (Number(p[0]) + 543);
}

function escapeHtml(value) {
    return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* =========================================================
   MONTH
========================================================= */

function previousMonth() {
    currentMonth.setMonth(currentMonth.getMonth() - 1);
    updateMonthText();

    if (databaseReady) {
        loadTransactions();
    } else {
        showNoDatabaseData();
    }
}

function nextMonth() {
    currentMonth.setMonth(currentMonth.getMonth() + 1);
    updateMonthText();

    if (databaseReady) {
        loadTransactions();
    } else {
        showNoDatabaseData();
    }
}

function getMonthRange() {
    var year = currentMonth.getFullYear();
    var month = currentMonth.getMonth();

    var start =
        year + "-" +
        String(month + 1).padStart(2, "0") +
        "-01";

    var next = new Date(year, month + 1, 1);

    var end =
        next.getFullYear() + "-" +
        String(next.getMonth() + 1).padStart(2, "0") +
        "-01";

    return {
        start: start,
        end: end
    };
}

/* =========================================================
   FORM
========================================================= */

function openForm() {
    editingId = null;

    $("formTitle").textContent = "เพิ่มรายการ";
    $("type").value = "income";
    $("amount").value = "";
    $("category").value = "Food";
    $("description").value = "";
    $("date").value = getToday();

    $("form").style.display = "block";

    setTimeout(function() {
        $("amount").focus();
    }, 100);

    window.scrollTo({
        top: $("form").offsetTop - 10,
        behavior: "smooth"
    });
}

function closeForm() {
    $("form").style.display = "none";
    editingId = null;
}

function prepareEdit(item) {
    editingId = item.id;

    $("formTitle").textContent = "แก้ไขรายการ";
    $("type").value = item.type;
    $("amount").value = item.amount;
    $("category").value = item.category;
    $("description").value = item.description || "";
    $("date").value = item.transaction_date;

    $("form").style.display = "block";

    window.scrollTo({
        top: $("form").offsetTop - 10,
        behavior: "smooth"
    });
}

/* =========================================================
   FILTER
========================================================= */

function resetFilters() {
    $("search").value = "";
    $("typeFilter").value = "all";
    $("categoryFilter").value = "all";
    $("sort").value = "date_desc";

    renderFiltered();
}

function renderFiltered() {
    var keyword = $("search").value.trim().toLowerCase();
    var selectedType = $("typeFilter").value;
    var selectedCategory = $("categoryFilter").value;
    var selectedSort = $("sort").value;

    var result = allTransactions.filter(function(item) {
        var text =
            String(item.description || "").toLowerCase() +
            " " +
            String(item.category || "").toLowerCase() +
            " " +
            categoryName(item.category).toLowerCase();

        var searchOK =
            keyword === "" ||
            text.indexOf(keyword) !== -1;

        var typeOK =
            selectedType === "all" ||
            item.type === selectedType;

        var categoryOK =
            selectedCategory === "all" ||
            item.category === selectedCategory;

        return searchOK && typeOK && categoryOK;
    });

    result.sort(function(a, b) {
        if (selectedSort === "amount_desc") {
            return Number(b.amount) - Number(a.amount);
        }

        if (selectedSort === "amount_asc") {
            return Number(a.amount) - Number(b.amount);
        }

        if (selectedSort === "date_asc") {
            return String(a.transaction_date)
                .localeCompare(String(b.transaction_date));
        }

        return String(b.transaction_date)
            .localeCompare(String(a.transaction_date));
    });

    renderTransactions(result);

    $("resultCount").textContent =
        result.length + " รายการ";
}

/* =========================================================
   SUMMARY
========================================================= */

function updateSummary() {
    var income = 0;
    var expense = 0;

    allTransactions.forEach(function(item) {
        var value = Number(item.amount) || 0;

        if (item.type === "income") {
            income += value;
        } else if (item.type === "expense") {
            expense += value;
        }
    });

    $("income").textContent = "฿" + money(income);
    $("expense").textContent = "฿" + money(expense);
    $("balance").textContent = "฿" + money(income - expense);

    $("balance").classList.remove("green");
    $("balance").classList.remove("red");

    if (income - expense < 0) {
        $("balance").classList.add("red");
    } else {
        $("balance").classList.add("green");
    }
}

/* =========================================================
   CATEGORY ANALYSIS
========================================================= */

function renderAnalysis() {
    var incomeCategories = {};
    var expenseCategories = {};

    allTransactions.forEach(function(item) {
        var value = Number(item.amount) || 0;

        if (item.type === "income") {
            incomeCategories[item.category] =
                (incomeCategories[item.category] || 0) + value;
        } else {
            expenseCategories[item.category] =
                (expenseCategories[item.category] || 0) + value;
        }
    });

    renderCategoryBox(
        expenseCategories,
        $("expenseAnalysis"),
        "ยังไม่มีรายจ่าย"
    );

    renderCategoryBox(
        incomeCategories,
        $("incomeAnalysis"),
        "ยังไม่มีรายรับ"
    );
}

function renderCategoryBox(data, element, emptyText) {
    var keys = Object.keys(data);

    element.innerHTML = "";

    if (keys.length === 0) {
        element.innerHTML =
            '<div class="center">' +
            emptyText +
            "</div>";

        return;
    }

    var total = 0;

    keys.forEach(function(key) {
        total += Number(data[key]) || 0;
    });

    keys.sort(function(a, b) {
        return data[b] - data[a];
    });

    keys.forEach(function(key) {
        var value = Number(data[key]) || 0;
        var percent =
            total > 0 ? (value / total) * 100 : 0;

        var row = document.createElement("div");
        row.className = "category";

        row.innerHTML =
            '<div class="category-top">' +
                "<span>" +
                escapeHtml(categoryName(key)) +
                "</span>" +
                "<span>฿" +
                money(value) +
                " · " +
                percent.toFixed(1) +
                "%</span>" +
            "</div>" +
            '<div class="bar-bg">' +
                '<div class="bar" style="width:' +
                Math.min(percent, 100) +
                '%"></div>' +
            "</div>";

        element.appendChild(row);
    });
}

/* =========================================================
   TRANSACTIONS DISPLAY
========================================================= */

function renderTransactions(data) {
    var box = $("transactions");

    box.innerHTML = "";

    if (!data.length) {
        box.innerHTML =
            '<div class="center">ไม่มีรายการในเดือนนี้</div>';

        return;
    }

    data.forEach(function(item) {
        var element = document.createElement("div");
        element.className = "transaction";

        var value = Number(item.amount) || 0;
        var income = item.type === "income";

        var main = document.createElement("div");
        main.className = "transaction-main";

        var left = document.createElement("div");
        left.className = "transaction-left";

        var name = document.createElement("div");
        name.className = "transaction-name";
        name.textContent = categoryName(item.category);

        var detail = document.createElement("div");
        detail.className = "transaction-detail";
        detail.textContent = item.description || "";

        var day = document.createElement("div");
        day.className = "transaction-detail";
        day.textContent = formatDate(item.transaction_date);

        left.appendChild(name);
        left.appendChild(detail);
        left.appendChild(day);

        var valueBox = document.createElement("div");
        valueBox.className =
            "transaction-amount " +
            (income ? "green" : "red");

        valueBox.textContent =
            (income ? "+" : "-") +
            "฿" +
            money(value);

        main.appendChild(left);
        main.appendChild(valueBox);

        var actions = document.createElement("div");
        actions.className = "actions";

        var editButton = document.createElement("button");
        editButton.type = "button";
        editButton.className = "edit";
        editButton.textContent = "✏️ แก้ไข";

        editButton.onclick = function() {
            prepareEdit(item);
        };

        var deleteButton = document.createElement("button");
        deleteButton.type = "button";
