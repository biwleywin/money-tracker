<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Money Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   THEME VARIABLES
===================================================== */

:root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #222222;
    --muted: #777777;
    --border: #e8e8e8;
    --input: #ffffff;
    --button: #111111;
    --button-text: #ffffff;
    --bar: #222222;
}

body.dark {
    --bg: #111315;
    --card: #1b1e21;
    --text: #f1f1f1;
    --muted: #999999;
    --border: #303438;
    --input: #24282c;
    --button: #f1f1f1;
    --button-text: #111111;
    --bar: #f1f1f1;
}


/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    transition:
        background 0.2s,
        color 0.2s;
}

button,
input,
select {
    font-family: inherit;
}


/* =====================================================
   CONTAINER
===================================================== */

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 20px;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.header h1 {
    margin: 10px 0 20px;
    font-size: 30px;
}

.theme-btn {
    width: 45px;
    height: 45px;

    border: 0;
    border-radius: 12px;

    background: var(--card);
    color: var(--text);

    font-size: 20px;

    cursor: pointer;
}


/* =====================================================
   MONTH
===================================================== */

.month {
    background: var(--card);

    border-radius: 14px;

    padding: 12px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 15px;
}

.month button {
    width: 45px;
    height: 42px;

    border: 0;
    border-radius: 10px;

    background: var(--border);
    color: var(--text);

    font-size: 24px;

    cursor: pointer;
}

#monthText {
    font-size: 18px;
    font-weight: bold;
}


/* =====================================================
   SUMMARY
===================================================== */

.summary {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;
}

.card {
    background: var(--card);

    padding: 15px;

    border-radius: 14px;
}

.card small {
    color: var(--muted);
}

.card strong {
    display: block;

    margin-top: 8px;

    font-size: 19px;
}

.green {
    color: #16803c;
}

.red {
    color: #d62828;
}


/* =====================================================
   ADD BUTTON
===================================================== */

.add {
    width: 100%;

    padding: 15px;

    margin-top: 15px;

    border: 0;
    border-radius: 12px;

    background: var(--button);
    color: var(--button-text);

    font-size: 16px;

    cursor: pointer;
}


/* =====================================================
   FORM
===================================================== */

.form {
    display: none;

    background: var(--card);

    padding: 18px;

    border-radius: 14px;

    margin-top: 15px;
}

.form h2 {
    margin-top: 0;
}

label {
    display: block;

    margin-top: 12px;
    margin-bottom: 5px;

    font-size: 14px;
}

input,
select {
    width: 100%;

    padding: 12px;

    border: 1px solid var(--border);

    border-radius: 10px;

    font-size: 16px;

    background: var(--input);
    color: var(--text);

    outline: none;
}

input:focus,
select:focus {
    border-color: #888;
}

.save {
    width: 100%;

    margin-top: 18px;

    padding: 13px;

    border: 0;
    border-radius: 10px;

    background: #16803c;
    color: white;

    font-size: 16px;

    cursor: pointer;
}

.cancel {
    width: 100%;

    margin-top: 8px;

    padding: 13px;

    border: 0;
    border-radius: 10px;

    background: var(--border);
    color: var(--text);

    font-size: 16px;

    cursor: pointer;
}


/* =====================================================
   ANALYSIS
===================================================== */

.analysis {
    background: var(--card);

    border-radius: 14px;

    padding: 18px;

    margin-top: 20px;
}

.analysis-title {
    font-size: 18px;
    font-weight: bold;

    margin-bottom: 15px;
}

.category {
    margin-bottom: 15px;
}

.category-top {
    display: flex;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 6px;

    font-size: 14px;
}

.bar-bg {
    height: 8px;

    background: var(--border);

    border-radius: 20px;

    overflow: hidden;
}

.bar {
    height: 100%;

    background: var(--bar);

    border-radius: 20px;
}


/* =====================================================
   TRANSACTIONS
===================================================== */

.transaction {
    background: var(--card);

    padding: 15px;

    border-radius: 13px;

    margin-bottom: 10px;
}

.transaction-main {
    display: flex;

    justify-content: space-between;

    gap: 10px;
}

.transaction-name {
    font-weight: bold;
}

.transaction-detail {
    color: var(--muted);

    font-size: 14px;

    margin-top: 5px;
}

.transaction-amount {
    font-weight: bold;

    white-space: nowrap;
}

.actions {
    display: flex;

    gap: 8px;

    margin-top: 12px;

    padding-top: 10px;

    border-top: 1px solid var(--border);
}

.edit,
.delete {
    flex: 1;

    padding: 9px;

    border: 0;

    border-radius: 9px;

    cursor: pointer;
}

.edit {
    background: var(--border);
    color: var(--text);
}

.delete {
    background: #ffe5e5;
    color: #c62828;
}


/* =====================================================
   STATUS
===================================================== */

.center {
    text-align: center;

    color: var(--muted);

    padding: 25px;
}

.error-box {
    background: #ffe5e5;

    color: #b71c1c;

    border-radius: 12px;

    padding: 15px;

    margin-top: 15px;

    font-size: 14px;

    word-break: break-word;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 450px) {

    .summary {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 28px;
    }

}

</style>

</head>

<body>

<div class="container">

<!-- =====================================================

<div

</div>


<!-- =====================================================

===================================================== -->

<div class="analysis">

    </div>

</div>


<!-- =====================================================
     INCOME ANALYSIS

<div class="analysis">

    <div class="analysis-title">

    </div>


    <div id="incomeAnalysis">

        <div class="center">

        </div>

    </div>

</div>


<!-- =====================================================
     TRANSACTIONS
===================================================== -->

<h2>

    รายการในเดือนนี้

</h2>


<div id="transactions">

    <div class="center">

        กำลังโหลด...

    </div>

</div>


</div>


<script>

/* =====================================================
   SUPABASE CONFIG

const SUPABASE_URL =
    "https://sbiziifpybyzljikjnrh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aD38PwfPHzSYU83kIbmnEg_rHVMgomF";

const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   GLOBAL STATE
===================================================== */

let currentMonth =
    new Date();

currentMonth.setDate(1);

let editingId = null;


/* =====================================================
   MONTH NAMES
===================================================== */

const thaiMonths = [

    "มกราคม",
    "กุมภาพันธ์",
    "มีนาคม",
    "เมษายน",
    "พฤษภาคม",
    "มิถุนายน",
    "กรกฎาคม",
    "สิงหาคม",
    "กันยายน",
    "ตุลาคม",
    "พฤศจิกายน",
    "ธันวาคม"

];


/* =====================================================
   CATEGORY NAMES
===================================================== */

const categoryNames = {

    Food: "อาหาร",

    Transport: "เดินทาง",

    Gaming: "เกม",

    Roblox: "Roblox",

    Shopping: "ซื้อของ",

    Salary: "เงินเดือน",

    Other: "อื่น ๆ"

};


/* =====================================================
   SAFE ELEMENT
===================================================== */

function getElement(id) {

    return document.getElementById(id);

}


/* =====================================================
   THEME
===================================================== */

function loadTheme() {

    try {

        const saved =
            localStorage.getItem(
                "money-theme"
            );


        if (
            saved === "dark"
        ) {

            document.body.classList.add(
                "dark"
            );

        }


        updateThemeButton();


    } catch (error) {

        console.error(
            "Theme error:",
            error
        );

    }

}


function updateThemeButton() {

    const button =
        getElement(
            "themeButton"
        );


    if (!button) {
        return;
    }


    button.textContent =
        document.body.classList.contains(
            "dark"
        )
            ? "☀️"
            : "🌙";

}


function toggleTheme() {

    const isDark =
        document.body.classList.toggle(
            "dark"
        );


    try {

        localStorage.setItem(
            "money-theme",
            isDark
                ? "dark"
                : "light"
        );

    } catch (error) {

        console.error(
            "Theme save error:",
            error
        );

    }


    updateThemeButton();

}


/* =====================================================
   MONTH DISPLAY
===================================================== */

function updateMonthLabel() {

    const element =
        getElement(
            "monthText"
        );


    if (!element) {
        return;
    }


    const month =
        thaiMonths[
            currentMonth.getMonth()
        ];


    const year =
        currentMonth.getFullYear()
        + 543;


    element.textContent =
        month +
        " " +
        year;

}


/*
   Alias สำรอง
   กันปัญหาชื่อฟังก์ชันจาก V3/V4
*/

function updateMonth() {

    updateMonthLabel();

}


/* =====================================================
   MONTH NAVIGATION
===================================================== */

function previousMonth() {

    currentMonth.setMonth(
        currentMonth.getMonth() - 1
    );


    updateMonthLabel();


    loadTransactions();

}


function nextMonth() {

    currentMonth.setMonth(
        currentMonth.getMonth() + 1
    );


    updateMonthLabel();


    loadTransactions();

}


/* =====================================================
   MONTH RANGE
===================================================== */

function getMonthRange() {

    const year =
        currentMonth.getFullYear();


    const month =
        currentMonth.getMonth();


    const start =
        year +
        "-" +
        String(
            month + 1
        ).padStart(
            2,
            "0"
        ) +
        "-01";


    const next =
        new Date(
            year,
            month + 1,
            1
        );


    const end =
        next.getFullYear() +
        "-" +
        String(
            next.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +
        "-01";


    return {
        start: start,
        end: end
    };

}


/* =====================================================
   AUTH
===================================================== */

async function login() {

    try {

        const sessionResult =
            await db.auth.getSession();


        if (
            sessionResult.data &&
            sessionResult.data.session
        ) {

            return true;

        }


        const result =
            await db.auth
                .signInAnonymously();


        if (
            result.error
        ) {

            showError(
                "Login ไม่สำเร็จ",
                result.error.message
            );

            return false;

        }


        return true;


    } catch (error) {

        showError(
            "เกิดข้อผิดพลาดตอน Login",
            error.message
        );

        return false;

    }

}


/* =====================================================
   FORM OPEN
===================================================== */

function openForm() {

    editingId = null;


    const title =
        getElement(
            "formTitle"
        );


    if (title) {

        title.textContent =
            "เพิ่มรายการ";

    }


    getElement(
        "type"
    ).value =
        "income";


    getElement(
        "amount"
    ).value =
        "";


    getElement(
        "category"
    ).value =
        "Food";


    getElement(
        "description"
    ).value =
        "";


    setToday();


    getElement(
        "form"
    ).style.display =
        "block";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =====================================================
   FORM CLOSE
===================================================== */

function closeForm() {

    getElement(
        "form"
    ).style.display =
        "none";


    editingId = null;

}


/* =====================================================
   TODAY
===================================================== */

function setToday() {

    const today =
        new Date();


    const year =
        today.getFullYear();


    const month =
        String(
            today.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            today.getDate()
        ).padStart(
            2,
            "0"
        );


    getElement(
        "date"
    ).value =
        year +
        "-" +
        month +
        "-" +
        day;

}


/* =====================================================
   SAVE TRANSACTION
===================================================== */

    try {

            getElement(
                "type"
            ).value;


        const amount =
            Number(
                getElement(
                    "amount"
                ).value
            );


        const category =
            getElement(
                "category"
            ).value;


        const description =
            getElement(
                "description"
            ).value.trim();


        const date =
            getElement(
                "date"
            ).value;


        if (
            !amount ||
            amount <= 0
        ) {

            alert(
                "กรอกจำนวนเงินก่อน"
            );

            return;

        }


        if (!category) {

            alert(
                "เลือกหมวดหมู่ก่อน"
            );

            return;

        }


        if (!date) {

            alert(
                "เลือกวันที่ก่อน"
            );

            return;

        }


        const userResult =
            await db.auth.getUser();


        const user =
            userResult.data.user;


        if (!user) {

            alert(
                "ไม่พบ User"
            );

            return;

        }


        let result;


        if (editingId) {

            result =
                await db
                    .from(
                        "transactions"
                    )
                    .update({

                        type:
                            type,

                        amount:
                            amount,

                        category:
                            category,
