<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Money Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #222222;
    --muted: #777777;
    --border: #eeeeee;
    --input: #ffffff;
    --button: #111111;
    --button-text: #ffffff;
    --bar-bg: #eeeeee;
}

body.dark {
    --bg: #111315;
    --card: #1b1e21;
    --text: #f1f1f1;
    --muted: #999999;
    --border: #303438;
    --input: #24282c;
    --button: #f1f1f1;
    --button-text: #111111;
    --bar-bg: #33383d;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    transition: background 0.2s, color 0.2s;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

h1 {
    margin: 10px 0 20px;
    font-size: 32px;
}

h2 {
    margin-top: 25px;
}

/* =========================
   HEADER
========================= */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.header h1 {
    margin: 10px 0 20px;
}

.theme-btn {
    width: 45px;
    height: 45px;

    border: 0;
    border-radius: 12px;

    background: var(--card);
    color: var(--text);

    font-size: 21px;
}

/* =========================
   MONTH
========================= */

.month {
    background: var(--card);

    border-radius: 14px;

    padding: 12px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 15px;
}

.month button {
    width: 45px;
    height: 42px;

    border: 0;
    border-radius: 10px;

    background: var(--border);
    color: var(--text);

    font-size: 24px;
}

#monthText {
    font-weight: bold;
    font-size: 18px;
}

/* =========================
   SUMMARY
========================= */

.summary {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;
}

.card {
    background: var(--card);

    padding: 15px;

    border-radius: 14px;
}

.card small {
    color: var(--muted);
}

.card strong {
    display: block;

    margin-top: 8px;

    font-size: 19px;
}

.green {
    color: #16803c;
}

.red {
    color: #d62828;
}

/* =========================
   ADD BUTTON
========================= */

.add {
    width: 100%;

    padding: 15px;

    margin-top: 15px;

    border: 0;
    border-radius: 12px;

    background: var(--button);
    color: var(--button-text);

    font-size: 16px;
}

/* =========================
   FORM
========================= */

.form {
    display: none;

    background: var(--card);

    padding: 18px;

    border-radius: 14px;

    margin-top: 15px;
}

label {
    display: block;

    margin-top: 12px;
    margin-bottom: 5px;

    font-size: 14px;
}

input,
select {
    width: 100%;

    padding: 12px;

    border: 1px solid var(--border);

    border-radius: 10px;

    font-size: 16px;

    background: var(--input);
    color: var(--text);
}

.save {
    width: 100%;

    margin-top: 18px;

    padding: 13px;

    border: 0;
    border-radius: 10px;

    background: #16803c;
    color: white;

    font-size: 16px;
}

.cancel {
    width: 100%;

    margin-top: 8px;

    padding: 13px;

    border: 0;
    border-radius: 10px;

    background: var(--border);
    color: var(--text);

    font-size: 16px;
}

/* =========================
   ANALYSIS
========================= */

.analysis {
    background: var(--card);

    border-radius: 14px;

    padding: 18px;

    margin-top: 20px;
}

.analysis-title {
    font-weight: bold;

    font-size: 18px;

    margin-bottom: 15px;
}

.category {
    margin-bottom: 15px;
}

.category-top {
    display: flex;

    justify-content: space-between;

    margin-bottom: 6px;

    font-size: 14px;
}

.bar-bg {
    height: 8px;

    background: var(--bar-bg);

    border-radius: 20px;

    overflow: hidden;
}

.bar {
    height: 100%;

    background: var(--text);

    border-radius: 20px;
}

/* =========================
   TRANSACTION
========================= */

.transaction {
    background: var(--card);

    padding: 15px;

    border-radius: 13px;

    margin-bottom: 10px;
}

.transaction-main {
    display: flex;

    justify-content: space-between;

    gap: 10px;
}

.transaction-name {
    font-weight: bold;
}

.transaction-detail {
    color: var(--muted);

    font-size: 14px;

    margin-top: 5px;
}

.transaction-amount {
    font-weight: bold;

    white-space: nowrap;
}

.actions {
    display: flex;

    gap: 8px;

    margin-top: 12px;

    padding-top: 10px;

    border-top: 1px solid var(--border);
}

.edit,
.delete {
    flex: 1;

    padding: 9px;

    border: 0;

    border-radius: 9px;
}

.edit {
    background: var(--border);
    color: var(--text);
}

.delete {
    background: #ffe5e5;
    color: #c62828;
}

.center {
    text-align: center;

    color: var(--muted);

    padding: 25px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 450px) {

    .summary {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 30px;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>
            💰 Money Tracker
        </h1>

        <button
            class="theme-btn"
            id="themeButton"
            onclick="toggleTheme()">

            🌙

        </button>

    </div>


    <!-- MONTH -->

    <div class="month">

        <button onclick="previousMonth()">
            ‹
        </button>

        <div id="monthText">
            กำลังโหลด...
        </div>

        <button onclick="nextMonth()">
            ›
        </button>

    </div>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="card">

            <small>
                รายรับ
            </small>

            <strong
                id="income"
                class="green">

                ฿0

            </strong>

        </div>


        <div class="card">

            <small>
                รายจ่าย
            </small>

            <strong
                id="expense"
                class="red">

                ฿0

            </strong>

        </div>


        <div class="card">

            <small>
                คงเหลือ
            </small>

            <strong id="balance">

                ฿0

            </strong>

        </div>

    </div>


    <!-- ADD -->

    <button
        class="add"
        onclick="openForm()">

        ＋ เพิ่มรายการ

    </button>


    <!-- FORM -->

    <div
        class="form"
        id="form">

        <h2 id="formTitle">
            เพิ่มรายการ
        </h2>


        <label>
            ประเภท
        </label>

        <select id="type">

            <option value="income">
                รายรับ
            </option>

            <option value="expense">
                รายจ่าย
            </option>

        </select>


        <label>
            จำนวนเงิน
        </label>

        <input
            id="amount"
            type="number"
            min="0"
            step="0.01"
            placeholder="เช่น 500"
        >


        <label>
            หมวดหมู่
        </label>

        <select id="category">

            <option value="Food">
                อาหาร
            </option>

            <option value="Transport">
                เดินทาง
            </option>

            <option value="Gaming">
                เกม
            </option>

            <option value="Roblox">
                Roblox
            </option>

            <option value="Shopping">
                ซื้อของ
            </option>

            <option value="Salary">
                เงินเดือน
            </option>

            <option value="Other">
                อื่น ๆ
            </option>

        </select>


        <label>
            รายละเอียด
        </label>

        <input
            id="description"
            type="text"
            placeholder="เช่น ขายไอเทม"
        >


        <label>
            วันที่
        </label>

        <input
            id="date"
            type="date"
        >


        <button
            class="save"

            บันทึก

        <button

            ยกเลิก

        </button>

    </div>


    <!-- EXPENSE ANALYSIS -->

    <div class="analysis">

        <div class="analysis-title">
            📊 สรุปรายจ่ายตามหมวด
        </div>

        <div id="expenseAnalysis">

            <div class="center">
                ยังไม่มีรายจ่าย
            </div>

        </div>

    </div>


    <!-- INCOME ANALYSIS -->

    <div class="analysis">

        <div class="analysis-title">
            💰 สรุปรายรับตามหมวด
        </div>

        <div id="incomeAnalysis">

            <div class="center">
                ยังไม่มีรายรับ
            </div>

        </div>

    </div>


    <!-- TRANSACTIONS -->

    <h2>
        รายการในเดือนนี้
    </h2>

    <div id="transactions">

        <div class="center">
            กำลังโหลด...
        </div>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://sbiziifpybyzljikjnrh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aD38PwfPHzSYU83kIbmnEg_rHVMgomF";

const db =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   STATE
========================= */

let currentMonth =
    new Date();

currentMonth.setDate(1);

let editingId = null;


/* =========================
   MONTHS
========================= */

const months = [

    "มกราคม",
    "กุมภาพันธ์",
    "มีนาคม",
    "เมษายน",
    "พฤษภาคม",
    "มิถุนายน",
    "กรกฎาคม",
    "สิงหาคม",
    "กันยายน",
    "ตุลาคม",
    "พฤศจิกายน",
    "ธันวาคม"

];


/* =========================
   THEME
========================= */

function loadTheme() {

    const saved =
        localStorage.getItem(
            "money-theme"
        );


    if (
        saved === "dark"
    ) {

        document.body.classList.add(
            "dark"
        );

        document.getElementById(
            "themeButton"
        ).textContent =
            "☀️";

    }

}


function toggleTheme() {

    const dark =
        document.body.classList.toggle(
            "dark"
        );


    localStorage.setItem(
        "money-theme",
        dark
            ? "dark"
            : "light"
    );


    document.getElementById(
        "themeButton"
    ).textContent =
        dark
            ? "☀️"
            : "🌙";

}


/* =========================
   MONTH
========================= */

function updateMonth() {

    const month =
        months[
            currentMonth.getMonth()
        ];


    const year =
        currentMonth.getFullYear()
        + 543;


    document.getElementById(
        "monthText"
    ).textContent =
        month +
        " " +
        year;

}


function previousMonth() {

    currentMonth.setMonth(
        currentMonth.getMonth() - 1
    );

    updateMonth();

    loadTransactions();

}


function nextMonth() {

    currentMonth.setMonth(
        currentMonth.getMonth() + 1
    );

    updateMonth();

    loadTransactions();

}


/* =========================
   MONTH RANGE
========================= */

function getMonthRange() {

    const year =
        currentMonth.getFullYear();

    const month =
        currentMonth.getMonth();


    const start =
        year +
        "-" +
        String(
            month + 1
        ).padStart(
            2,
            "0"
        ) +
        "-01";


    const next =
        new Date(
            year,
            month + 1,
            1
        );


    const end =
        next.getFullYear() +
        "-" +
        String(
            next.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +
        "-01";


    return {
        start,
        end
    };

}


/* =========================
   LOGIN
========================= */

async function login() {

    const result =
        await db.auth.getSession();


    if (
        result.data.session
    ) {

        return true;

    }


    const loginResult =
        await db.auth
            .signInAnonymously();


    if (
        loginResult.error
    ) {

        alert(
            "Login ไม่สำเร็จ: " +
            loginResult.error.message
        );

        return false;

    }


    return true;

}


/* =========================
   FORM
========================= */

function openForm() {

    editingId = null;


    document.getElementById(
        "formTitle"
    ).textContent =
        "เพิ่มรายการ";


    document.getElementById(
        "type"
    ).value =
        "income";


    document.getElementById(
        "amount"
    ).value =
        "";


    document.getElementById(
        "description"
    ).value =
        "";


    setToday();


    document.getElementById(
        "form"
    ).style.display =
        "block";

}


function closeForm() {

    document.getElementById(
        "form"
    ).style.display =
        "none";


    editingId = null;

}


function setToday() {

    const today =
        new Date();


    const year =
        today.getFullYear();


    const month =
        String(
            today.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            today.getDate()
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "date"
    ).value =
        year +
        "-" +
        month +
        "-" +
        day;

}


/* =========================
   SAVE
========================= */

async function saveTransaction() {

    const type =
        document.getElementById(
            "type"
        ).value;


    const amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        );


    const category =
        document.getElementById(
            "category"
        ).value;


    const description =
        document.getElementById(
            "description"
        ).value.trim();


    const date =
        document.getElementById(
            "date"
        ).value;


    if (
        !amount ||
        amount <= 0
    ) {

        alert(
            "กรอกจำนวนเงินก่อน"
        );

        return;

    }


    if (!date) {

        alert(
            "เลือกวันที่ก่อน"
        );

        return;

    }


    const userResult =
        await db.auth.getUser();


    const user =
        userResult.data.user;


    if (!user) {

        alert(
            "ไม่พบ User"
        );

        return;

    }


    let result;


    if (editingId) {

        result =
            await db
                .from("transactions")
                .update({

                    type: type,

                    amount: amount,

                    category: category,

                    description: description,

                    transaction_date:
                        date

                })
                .eq(
                    "id",
                    editingId
                )
                .eq(
                    "user_id",
                    user.id
                );

    } else {

        result =
            await db
                .from("transactions")
                .insert({

                    user_id:
                        user.id,

                    type: type,

                    amount: amount,

                    category: category,

                    description: description,

                    transaction_date:
                        date

                });

    }


    if (
        result.error
    ) {

        alert(
            "บันทึกไม่สำเร็จ: " +
            result.error.message
        );

        return;

    }


    closeForm();

    loadTransactions();

}


/* =========================
   LOAD
========================= */

async function loadTransactions() {

    const container =
        document.getElementById(
            "transactions"
        );


    container.innerHTML =
        '<div class="center">' +
        'กำลังโหลด...' +
        '</div>';


    const range =
        getMonthRange();


    const result =
        await db
            .from("transactions")
            .select("*")
            .gte(
                "transaction_date",
                range.start
            )
            .lt(
                "transaction_date",
                range.end
            )
            .order(
                "transaction_date",
                {
                    ascending:
                        false
                }
            );


    if (
        result.error
    ) {

        container.innerHTML =
            '<div class="center">' +
            'โหลดข้อมูลไม่ได้<br>' +
            result.error.message +
            '</div>';

        return;

    }


    const data =
        result.data || [];


    let income = 0;

    let expense = 0;


    const incomeCategories = {};

    const expenseCategories = {};


    container.innerHTML = "";


    if (
        data.length === 0
    ) {

        container.innerHTML =
            '<div class="center">' +
            'ไม่มีรายการในเดือนนี้' +
            '</div>';


        updateSummary(
            0,
            0
        );


        renderCategories(
            {},
            "incomeAnalysis"
        );


        renderCategories(
            {},
            "expenseAnalysis"
        );


        return;

    }


    data.forEach(
        function(item) {

            const value =
                Number(
                    item.amount
                );


            if (
                item.type ===
                "income"
            ) {

                income +=
                    value;


                incomeCategories[
                    item.category
                ] =
                    (
                        incomeCategories[
                            item.category
                        ] || 0
                    ) +
                    value;

            } else {

                expense +=
                    value;


                expenseCategories[
                    item.category
                ] =
                    (
                        expenseCategories[
                            item.category
                        ] || 0
                    ) +
                    value;

            }


            createTransaction(
                item
            );

        }
    );


    updateSummary(
        income,
        expense
    );


    renderCategories(
        incomeCategories,
        "incomeAnalysis"
    );


    renderCategories(
        expenseCategories,
        "expenseAnalysis"
    );

}


/* =========================
   CREATE TRANSACTION
========================= */

function createTransaction(
    item
) {

    const container =
        document.getElementById(
            "transactions"
        );


    const value =
        Number(
            item.amount
        );


    const income =
        item.type ===
        "income";


    const box =
        document.createElement(
            "div"
        );


    box.className =
        "transaction";


    box.innerHTML =

        '<div class="transaction-main">' +

            '<div>' +

                '<div class="transaction-name">' +
                escapeHtml(
                    categoryName(
                        item.category
                    )
                ) +
                '</div>' +

                '<div class="transaction-detail">' +
                escapeHtml(
                    item.description || ""
                ) +
