<!DOCTYPE html>
<html lang="th">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Money Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            font-size: 32px;
            margin: 10px 0 24px;
        }

        h2 {
            margin-top: 25px;
        }

        /* =========================
           MONTH
        ========================= */

        .month-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;

            background: white;

            padding: 14px;

            border-radius: 14px;

            margin-bottom: 14px;
        }

        .month-selector button {
            width: 44px;
            height: 42px;

            border: 0;
            border-radius: 10px;

            background: #f0f0f0;

            font-size: 22px;
        }

        #monthLabel {
            font-size: 18px;
            font-weight: bold;
        }

        /* =========================
           SUMMARY
        ========================= */

        .summary {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-bottom: 18px;
        }

        .card {
            background: white;

            padding: 15px;

            border-radius: 14px;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.05);
        }

        .card small {
            color: #777;
        }

        .card strong {
            display: block;

            margin-top: 8px;

            font-size: 18px;
        }

        .income {
            color: #16803c;
        }

        .expense {
            color: #d62828;
        }

        /* =========================
           ADD BUTTON
        ========================= */

        .add-btn {
            width: 100%;

            padding: 15px;

            border: 0;

            border-radius: 12px;

            background: #111;

            color: white;

            font-size: 16px;

            margin-bottom: 18px;
        }

        /* =========================
           FORM
        ========================= */

        .form {
            display: none;

            background: white;

            padding: 18px;

            border-radius: 14px;

            margin-bottom: 20px;
        }

        .form h2 {
            margin-top: 0;
        }

        label {
            display: block;

            margin-top: 12px;

            margin-bottom: 6px;

            font-size: 14px;
        }

        input,
        select {
            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            background: white;
        }

        .save-btn {
            width: 100%;

            background: #16803c;

            color: white;

            border: 0;

            padding: 14px;

            border-radius: 11px;

            margin-top: 18px;

            font-size: 16px;
        }

        .cancel-btn {
            width: 100%;

            background: #eee;

            border: 0;

            padding: 14px;

            border-radius: 11px;

            margin-top: 8px;

            font-size: 16px;
        }

        /* =========================
           ANALYSIS
        ========================= */

        .analysis {
            background: white;

            padding: 18px;

            border-radius: 14px;

            margin-top: 18px;
        }

        .analysis-title {
            font-size: 18px;

            font-weight: bold;

            margin-bottom: 14px;
        }

        .category-row {
            margin-bottom: 16px;
        }

        .category-header {
            display: flex;

            justify-content: space-between;

            margin-bottom: 6px;

            font-size: 14px;
        }

        .category-name {
            font-weight: bold;
        }

        .category-value {
            color: #555;
        }

        .bar-background {
            width: 100%;

            height: 8px;

            background: #eee;

            border-radius: 20px;

            overflow: hidden;
        }

        .bar {
            height: 100%;

            border-radius: 20px;

            background: #222;
        }

        .no-data {
            color: #777;

            text-align: center;

            padding: 10px 0;
        }

        /* =========================
           TRANSACTIONS
        ========================= */

        .transaction {
            background: white;

            padding: 15px;

            border-radius: 13px;

            margin-bottom: 10px;
        }

        .transaction-top {
            display: flex;

            justify-content: space-between;

            gap: 10px;
        }

        .transaction-info {
            min-width: 0;
        }

        .transaction-info strong {
            display: block;

            font-size: 16px;
        }

        .transaction-info small {
            display: block;

            color: #777;

            margin-top: 5px;

            word-break: break-word;
        }

        .amount {
            font-weight: bold;

            white-space: nowrap;
        }

        .transaction-actions {
            display: flex;

            gap: 8px;

            margin-top: 12px;

            border-top: 1px solid #eee;

            padding-top: 10px;
        }

        .edit-btn,
        .delete-btn {
            flex: 1;

            padding: 9px;

            border: 0;

            border-radius: 9px;

            font-size: 14px;
        }

        .edit-btn {
            background: #eee;
        }

        .delete-btn {
            background: #ffe5e5;

            color: #c62828;
        }

        .loading,
        .empty {
            text-align: center;

            color: #777;

            padding: 30px 10px;
        }

        .error {
            background: #ffe5e5;

            color: #b00020;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 15px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 450px) {

            .summary {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 30px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <h1>💰 Money Tracker</h1>


    <!-- =========================
         MONTH
    ========================= -->

    <div class="month-selector">

        <button onclick="changeMonth(-1)">
            ‹
        </button>

        <div id="monthLabel">
            กำลังโหลด...
        </div>

        <button onclick="changeMonth(1)">
            ›
        </button>

    </div>


    <!-- =========================
         SUMMARY
    ========================= -->

    <div class="summary">

        <div class="card">

            <small>
                รายรับ
            </small>

            <strong
                id="income"
                class="income">
                ฿0
            </strong>

        </div>


        <div class="card">

            <small>
                รายจ่าย
            </small>

            <strong
                id="expense"

                ฿0
            </strong>

        </div>


        <div class="card">

            <small>
                คงเหลือ
            </small>

            <strong id="balance">
                ฿0
            </strong>

        </div>

    </div>


    <!-- =========================
         ADD
    ========================= -->

    <button
        class="add-btn"
        onclick="openAddForm()">

        ＋ เพิ่มรายการ

    </button>


    <!-- =========================
         FORM
    ========================= -->

    <div
        class="form"
        id="form">

        <h2 id="formTitle">
            เพิ่มรายการ
        </h2>


        <label>
            ประเภท
        </label>

        <select id="type">

            <option value="income">
                รายรับ
            </option>

            <option value="expense">
                รายจ่าย
            </option>

        </select>


        <label>
            จำนวนเงิน
        </label>

        <input
            id="amount"
            type="number"
            placeholder="เช่น 500"
            min="0"
            step="0.01"
        >


        <label>
            หมวดหมู่
        </label>

        <select id="category">

            <option value="Food">
                อาหาร
            </option>

            <option value="Transport">
                เดินทาง
            </option>

            <option value="Gaming">
                เกม
            </option>

            <option value="Roblox">
                Roblox
            </option>

            <option value="Shopping">
                ซื้อของ
            </option>

            <option value="Salary">
                เงินเดือน
            </option>

            <option value="Other">
                อื่น ๆ
            </option>

        </select>


        <label>
            รายละเอียด
        </label>

        <input
            id="description"
            type="text"
            placeholder="เช่น ขายไอเทม"
        >


        <label>
            วันที่
        </label>

        <input
            id="date"
            type="date"
        >


        <button
            class="save-btn"
            onclick="saveTransaction()">

            บันทึก

        </button>


        <button
            class="cancel-btn"
            onclick="closeForm()">

            ยกเลิก

        </button>

    </div>


    <!-- =========================
         EXPENSE ANALYSIS
    ========================= -->

    <div class="analysis">

        <div class="analysis-title">
            📊 สรุปรายจ่ายตามหมวด
        </div>

        <div id="expenseAnalysis">

            <div class="no-data">
                ยังไม่มีรายจ่าย
            </div>

        </div>

    </div>


    <!-- =========================
         INCOME ANALYSIS
    ========================= -->

    <div class="analysis">

        <div class="analysis-title">
            💰 สรุปรายรับตามหมวด
        </div>

        <div id="incomeAnalysis">

            <div class="no-data">
                ยังไม่มีรายรับ
            </div>

        </div>

    </div>


    <!-- =========================
         TRANSACTIONS
    ========================= -->

    <h2>
        รายการในเดือนนี้
    </h2>


    <div id="transactions">

        <div class="loading">
            กำลังโหลด...
        </div>

    </div>

</div>
