<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Money Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-width: 0;
}

body {
    min-height: 100vh;
    background: #101214;
    color: #f1f1f1;
    font-family: Arial, "Noto Sans Thai", sans-serif;
    overflow-x: hidden;
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
}

h1 {
    margin: 8px 0 20px;
    font-size: 32px;
}

h2 {
    margin: 25px 0 12px;
    font-size: 21px;
}


/* =========================
   MONTH
========================= */

.month {
    width: 100%;
    min-height: 66px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 10px 12px;

    background: #1b1e22;
    border-radius: 14px;

    margin-bottom: 15px;
}

.month button {
    width: 45px;
    height: 42px;

    border: 0;
    border-radius: 10px;

    background: #30343a;
    color: white;

    font-size: 25px;
}

.month button:active {
    transform: scale(.96);
}

#monthText {
    font-size: 18px;
    font-weight: bold;
    text-align: center;
}


/* =========================
   SUMMARY
========================= */

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.card {
    min-width: 0;
    padding: 15px;

    background: #1b1e22;
    border-radius: 14px;
}

.card small {
    color: #999;
}

.card strong {
    display: block;
    margin-top: 8px;
    font-size: 19px;
    overflow-wrap: anywhere;
}

.green {
    color: #35c76f;
}

.red {
    color: #ff5757;
}


/* =========================
   ADD
========================= */

.add {
    width: 100%;

    margin-top: 15px;
    padding: 15px;

    border: 0;
    border-radius: 12px;

    background: #f1f1f1;
    color: #111;

    font-size: 16px;
    font-weight: bold;
}

.add:active {
    transform: scale(.99);
}


/* =========================
   FORM
========================= */

.form {
    display: none;

    margin-top: 15px;
    padding: 18px;

    background: #1b1e22;
    border-radius: 14px;
}

.form h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 12px;
    margin-bottom: 6px;

    color: #aaa;
    font-size: 14px;
}

input,
select {
    width: 100%;

    padding: 12px;

    border: 1px solid #3a3f45;
    border-radius: 10px;

    outline: none;

    background: #25292e;
    color: #f1f1f1;

    font-size: 16px;
}

input:focus,
select:focus {
    border-color: #777;
}

input::placeholder {
    color: #777;
}

.save {
    width: 100%;

    margin-top: 18px;
    padding: 13px;

    border: 0;
    border-radius: 10px;

    background: #16803c;
    color: white;

    font-weight: bold;
}

.cancel {
    width: 100%;

    margin-top: 8px;
    padding: 13px;

    border: 0;
    border-radius: 10px;

    background: #30343a;
    color: white;
}


/* =========================
   FILTER
========================= */

.filters {
    margin-top: 20px;
    padding: 16px;

    background: #1b1e22;
    border-radius: 14px;
}

.filter-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;

    margin-top: 10px;
}

.filter-reset {
    width: 100%;

    margin-top: 10px;
    padding: 10px;

    border: 0;
    border-radius: 9px;

    background: #30343a;
    color: white;
}

.result-count {
    margin-top: 12px;
    color: #888;
    font-size: 13px;
}


/* =========================
   ANALYSIS
========================= */

.analysis {
    margin-top: 20px;
    padding: 18px;

    background: #1b1e22;
    border-radius: 14px;
}

.analysis-title {
    margin-bottom: 15px;

    font-size: 18px;
    font-weight: bold;
}

.category {
    margin-bottom: 15px;
}

.category-top {
    display: flex;
    justify-content: space-between;

    gap: 10px;
    margin-bottom: 6px;

    font-size: 14px;
}

.bar-bg {
    width: 100%;
    height: 8px;

    overflow: hidden;

    background: #30343a;
    border-radius: 20px;
}

.bar {
    height: 100%;
    background: #f1f1f1;
    border-radius: 20px;
}


/* =========================
   TRANSACTION
========================= */

.transaction {
    margin-bottom: 10px;
    padding: 15px;

    background: #1b1e22;
    border-radius: 13px;
}

.transaction-main {
    display: flex;
    justify-content: space-between;

    gap: 12px;
}

.transaction-left {
    min-width: 0;
}

.transaction-name {
    font-weight: bold;
    overflow-wrap: anywhere;
}

.transaction-detail {
    margin-top: 5px;

    color: #999;
    font-size: 14px;

    overflow-wrap: anywhere;
}

.transaction-amount {
    flex-shrink: 0;
    font-weight: bold;
    white-space: nowrap;
}

.actions {
    display: flex;
    gap: 8px;

    margin-top: 12px;
    padding-top: 10px;

    border-top: 1px solid #30343a;
}

.edit,
.delete {
    flex: 1;

    padding: 9px;

    border: 0;
    border-radius: 9px;
}

.edit {
    background: #30343a;
    color: white;
}

.delete {
    background: #4a2525;
    color: #ff6b6b;
}


/* =========================
   GENERAL
========================= */

.center {
    padding: 25px;
    text-align: center;
    color: #999;
}

.error {
    margin-top: 15px;
    padding: 15px;

    background: #3a2020;
    border-radius: 12px;

    color: #ff7777;

    word-break: break-word;
}

.status {
    margin-top: 10px;

    padding: 8px 12px;

    border-radius: 8px;

    font-size: 13px;

    display: none;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 450px) {

    .container {
        padding: 16px;
    }

    h1 {
        font-size: 30px;
    }

    .summary {
        grid-template-columns: 1fr;
    }

    .filter-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>

<div class="container">

    <h1>💰 Money Tracker</h1>


    <!-- MONTH -->

    <div class="month">

        <button
            id="prevBtn"
            type="button"
        >
            ‹
        </button>

        <div id="monthText">
            <!-- JS ใส่เดือนตรงนี้ทันที -->
        </div>

        <button

        >

    </div>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="card">

            <small>รายรับ</small>

            <strong
                id="income"
                class="green"
            >
                ฿0
            </strong>

        </div>


        <div class="card">

            <small>รายจ่าย</small>

            <strong
                id="expense"
                class="red"
            >
                ฿0
            </strong>

        </div>


        <div class="card">

            <small>คงเหลือ</small>

            <strong
                id="balance"
            >
                ฿0

    </div>


    <!-- ADD -->

    <button
        id="addBtn"
        class="add"
        type="button"
    >
        ＋ เพิ่มรายการ
    </button>


    <!-- FORM -->

    <div
        id="form"
        class="form"
    >

        <h2 id="formTitle">
            เพิ่มรายการ
        </h2>


        <label>ประเภท</label>

        <select id="type">

            <option value="expense">

        <label>จำนวนเงิน</label>

        >


        <label>หมวดหมู่</label>

        <select id="category">

            <option value="Food">
                อาหาร
            </option>

            <option value="Transport">
                เดินทาง

                เกม
            </option>

            <option value="Roblox">
                Roblox
            </option>

            <option value="Shopping">
                ซื้อของ
            </option>

            <option value="Salary">
                เงินเดือน
            </option>

            <option value="Other">
                อื่น ๆ
            </option>

        </select>


        <label>รายละเอียด</label>

        <input
            id="description"
            type="text"
            maxlength="200"
            placeholder="เช่น ขายไอเทม"
        >


        <label>วันที่</label>

        <input
            id="date"
            type="date"
        >


        <button

            class="save"
            type="button"
        >
            บันทึก
        </button>


        <button
            id="cancelBtn"
            class="cancel"
            type="button"
        >
            ยกเลิก
        </button>

    </div>


    <!-- SEARCH -->

    <div class="filters">

        <input
            id="search"
            type="search"
            placeholder="🔎 ค้นหารายการ..."
            autocomplete="off"
        >


        <div class="filter-grid">

            <select id="typeFilter">

                <option value="all">
                    ทุกประเภท
                </option>

                <option value="income">
                    รายรับ
                </option>

                <option value="expense">
                    รายจ่าย
                </option>

            </select>


            <select id="categoryFilter">

                <option value="all">
                    ทุกหมวด
                </option>

                <option value="Food">
                    อาหาร
                </option>

                <option value="Transport">
                    เดินทาง
                </option>

                <option value="Gaming">
                    เกม
                </option>

                <option value="Roblox">
                    Roblox
                </option>

                <option value="Shopping">
                    ซื้อของ
                </option>

                <option value="Salary">
                    เงินเดือน
                </option>

                <option value="Other">
                    อื่น ๆ
                </option>

            </select>

        </div>


        <label>เรียงรายการ</label>

        <select id="sort">

            <option value="date_desc">

            </option>

            <option value="date_asc">

            <option value="amount_desc">

            </option>

            <option value="amount_asc">

        </select>


        <button
            id="resetBtn"

            type="button"

            รีเซ็ตตัวกรอง
        </button>


        <div

        >

    </div>


    <!-- EXPENSE -->

    <div class="analysis">

        <div class="analysis-title">
            📊 สรุปรายจ่ายตามหมวด
        </div>

        <div id="expenseAnalysis">

            <div class="center">
                ยังไม่มีรายจ่าย
            </div>

        </div>

    </div>


    <!-- INCOME -->

    <div class="analysis">

        <div class="analysis-title">
            💰 สรุปรายรับตามหมวด
        </div>

        <div id="incomeAnalysis">

            <div class="center">
                ยังไม่มีรายรับ
            </div>

        </div>

    </div>


    <!-- TRANSACTIONS -->

    <h2>
        รายการในเดือนนี้
    </h2>

    <div id="transactions">

        <div class="center">
            กำลังเชื่อมต่อฐานข้อมูล...
        </div>

    </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const SUPABASE_URL =
    "https://sbiziifpybyzljikjnrh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aD38PwfPHzSYU83kIbmnEg_rHVMgomF";


/* =========================================================
   STATE
========================================================= */

let db = null;

let currentMonth = new Date();

currentMonth.setDate(1);

let transactions = [];

let editingId = null;

let databaseReady = false;


/* =========================================================
   MONTHS
========================================================= */

const months = [
    "มกราคม",
    "กุมภาพันธ์",
    "มีนาคม",
    "เมษายน",
    "พฤษภาคม",
    "มิถุนายน",
    "กรกฎาคม",
    "สิงหาคม",
    "กันยายน",
    "ตุลาคม",
    "พฤศจิกายน",
    "ธันวาคม"
];


/* =========================================================
   DOM
========================================================= */

const monthText =
    document.getElementById("monthText");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const addBtn =
    document.getElementById("addBtn");

const form =
    document.getElementById("form");

const formTitle =
    document.getElementById("formTitle");

const type =
    document.getElementById("type");

const amount =
    document.getElementById("amount");

const category =
    document.getElementById("category");

const description =
    document.getElementById("description");

const date =
    document.getElementById("date");

const saveBtn =
    document.getElementById("saveBtn");

const cancelBtn =
    document.getElementById("cancelBtn");

const search =
    document.getElementById("search");

const typeFilter =
    document.getElementById("typeFilter");

const categoryFilter =
    document.getElementById("categoryFilter");

const sort =
    document.getElementById("sort");

const resetBtn =
    document.getElementById("resetBtn");

const transactionsBox =
    document.getElementById("transactions");

const resultCount =
    document.getElementById("resultCount");

const incomeBox =
    document.getElementById("income");

const expenseBox =
    document.getElementById("expense");

const balanceBox =
    document.getElementById("balance");

const expenseAnalysis =
    document.getElementById("expenseAnalysis");

const incomeAnalysis =
    document.getElementById("incomeAnalysis");


/* =========================================================
   MONTH UI
========================================================= */

function updateMonthText() {

    const name =
        months[currentMonth.getMonth()];

    const year =
        currentMonth.getFullYear() + 543;

    monthText.textContent =
        name + " " + year;

}


/* =========================================================
   MONTH RANGE
========================================================= */

function getMonthRange() {

    const year =
        currentMonth.getFullYear();

    const month =
        currentMonth.getMonth();


    const start =
        year +
        "-" +
        String(month + 1).padStart(2, "0") +
        "-01";


    const next =
        new Date(
            year,
            month + 1,
            1
        );


    const end =
        next.getFullYear() +
        "-" +
        String(
            next.getMonth() + 1
        ).padStart(2, "0") +
        "-01";


    return {
        start: start,
        end: end
    };

}


/* =========================================================
   MONTH BUTTONS
========================================================= */

prevBtn.addEventListener(
    "click",
    async function () {

        currentMonth.setMonth(
            currentMonth.getMonth() - 1
        );

        updateMonthText();

        if (databaseReady) {
            await loadTransactions();
        }

    }
);


nextBtn.addEventListener(
    "click",
    async function () {

        currentMonth.setMonth(
            currentMonth.getMonth() + 1
        );

        updateMonthText();

        if (databaseReady) {
            await loadTransactions();
        }

    }
);


/* =========================================================
   FORM
========================================================= */

function todayString() {

    const d = new Date();

    return (
        d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(d.getDate()).padStart(2, "0")
    );

}


function openForm() {

    editingId = null;

    formTitle.textContent =
        "เพิ่มรายการ";

    type.value =
        "income";

    amount.value =
        "";

    category.value =
        "Food";

    description.value =
        "";

    date.value =
        todayString();

    form.style.display =
        "block";

    form.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });

}


function closeForm() {

    form.style.display =
        "none";

    editingId = null;

}


addBtn.addEventListener(
    "click",
    openForm
);


cancelBtn.addEventListener(
    "click",
    closeForm
);


/* =========================================================
   SUPABASE INIT
========================================================= */

async function initializeDatabase() {

    try {

        if (
            typeof window.supabase ===
            "undefined"
        ) {

            throw new Error(
                "Supabase JavaScript โหลดไม่สำเร็จ"
            );

        }


        db =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const session =
            await db.auth.getSession();


        if (
            session.error
        ) {

            throw session.error;

        }


        if (
            !session.data.session
        ) {

            const login =
                await db.auth.signInAnonymously();


            if (login.error) {

                throw login.error;

            }

        }


        databaseReady =
            true;


        await loadTransactions();


    } catch (error) {

        databaseReady =
            false;


        transactionsBox.innerHTML =

            '<div class="error">' +

                '<strong>เชื่อมต่อฐานข้อมูลไม่ได้</strong>' +

                '<br><br>' +

                escapeHtml(
                    error.message
                ) +

                '<br><br>' +

                'ปุ่มเพิ่มรายการยังใช้งานได้ ' +
                'แต่การบันทึกข้อมูลต้องรอ Supabase'

            '</div>';

    }

}


/* =========================================================
   LOAD
========================================================= */

async function loadTransactions() {

    if (!db) {
        return;
    }


    transactionsBox.innerHTML =
        '<div class="center">กำลังโหลด...</div>';


    const range =
        getMonthRange();


    try {

        const result =
            await db
                .from("transactions")
                .select("*")
                .gte(
                    "transaction_date",
                    range.start
                )
                .lt(
                    "transaction_date",
                    range.end
                )
                .order(
                    "transaction_date",
                    {
                        ascending: false
                    }
                );


        if (result.error) {

            throw result.error;

        }


        transactions =
            result.data || [];


        renderAll();


    } catch (error) {

        transactions = [];

        renderAll();


        transactionsBox.innerHTML =

            '<div class="error">' +

                '<stro
