<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Money Tracker</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   BASE
===================================================== */

* {
    box-sizing: border-box;
}

:root {

    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #222222;
    --muted: #777777;
    --border: #eeeeee;
    --input: #ffffff;
    --input-border: #dddddd;
    --button: #111111;
    --button-text: #ffffff;
    --bar: #222222;

}

body.dark {

    --bg: #111315;
    --card: #1b1e21;
    --text: #f1f1f1;
    --muted: #999999;
    --border: #303438;
    --input: #24282c;
    --input-border: #3a3f44;
    --button: #f1f1f1;
    --button-text: #111111;
    --bar: #f1f1f1;

}

body {

    margin: 0;

    background: var(--bg);

    color: var(--text);

    font-family: Arial, sans-serif;

    transition:
        background 0.2s ease,
        color 0.2s ease;

}

.container {

    max-width: 600px;

    margin: auto;

    padding: 20px;

}

h1 {

    margin: 10px 0 20px;

    font-size: 32px;

}

h2 {

    margin-top: 25px;

}


/* =====================================================
   HEADER / THEME BUTTON
===================================================== */

.header {

    display: flex;

    align-items: center;

    justify-content: space-between;

}

.header h1 {

    margin: 10px 0 20px;

}

.theme-button {

    width: 45px;

    height: 45px;

    border: 0;

    border-radius: 12px;

    background: var(--card);

    color: var(--text);

    font-size: 21px;

    cursor: pointer;

}


/* =====================================================
   MONTH
===================================================== */

.month {

    background: var(--card);

    border-radius: 14px;

    padding: 12px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 15px;

}

.month button {

    width: 45px;

    height: 42px;

    border: 0;

    border-radius: 10px;

    background: var(--border);

    color: var(--text);

    font-size: 24px;

    cursor: pointer;

}

#monthText {

    font-weight: bold;

    font-size: 18px;

}


/* =====================================================
   SUMMARY
===================================================== */

.summary {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

}

.card {

    background: var(--card);

    padding: 15px;

    border-radius: 14px;

}

.card small {

    color: var(--muted);

}

.card strong {

    display: block;

    margin-top: 8px;

    font-size: 19px;

}

.green {

    color: #16803c;

}

.red {

    color: #d62828;

}


/* =====================================================
   ADD BUTTON
===================================================== */

.add {

    width: 100%;

    padding: 15px;

    margin-top: 15px;

    border: 0;

    border-radius: 12px;

    background: var(--button);

    color: var(--button-text);

    font-size: 16px;

    cursor: pointer;

}


/* =====================================================
   FORM
===================================================== */

.form {

    display: none;

    background: var(--card);

    padding: 18px;

    border-radius: 14px;

    margin-top: 15px;

}

label {

    display: block;

    margin-top: 12px;

    margin-bottom: 5px;

    font-size: 14px;

}

input,
select {

    width: 100%;

    padding: 12px;

    border: 1px solid var(--input-border);

    border-radius: 10px;

    font-size: 16px;

    background: var(--input);

    color: var(--text);

}

.save {

    width: 100%;

    margin-top: 18px;

    padding: 13px;

    border: 0;

    border-radius: 10px;

    background: #16803c;

    color: white;

    font-size: 16px;

    cursor: pointer;

}

.cancel {

    width: 100%;

    margin-top: 8px;

    padding: 13px;

    border: 0;

    border-radius: 10px;

    background: var(--border);

    color: var(--text);

    font-size: 16px;

    cursor: pointer;

}


/* =====================================================
   ANALYSIS
===================================================== */

.analysis {

    background: var(--card);

    border-radius: 14px;

    padding: 18px;

    margin-top: 20px;

}

.analysis-title {

    font-weight: bold;

    font-size: 18px;

    margin-bottom: 15px;

}

.category {

    margin-bottom: 15px;

}

.category-top {

    display: flex;

    justify-content: space-between;

    margin-bottom: 6px;

    font-size: 14px;

}

.bar-bg {

    height: 8px;

    background: var(--border);

    border-radius: 20px;

    overflow: hidden;

}

.bar {

    height: 100%;

    background: var(--bar);

}


/* =====================================================
   TRANSACTIONS
===================================================== */

.transaction {

    background: var(--card);

    padding: 15px;

    border-radius: 13px;

    margin-bottom: 10px;

}

.transaction-main {

    display: flex;

    justify-content: space-between;

    gap: 10px;

}

.transaction-name {

    font-weight: bold;

}

.transaction-detail {

    color: var(--muted);

    font-size: 14px;

    margin-top: 5px;

}

.transaction-amount {

    font-weight: bold;

    white-space: nowrap;

}

.actions {

    display: flex;

    gap: 8px;

    margin-top: 12px;

    padding-top: 10px;

    border-top: 1px solid var(--border);

}

.edit,
.delete {

    flex: 1;

    padding: 9px;

    border: 0;

    border-radius: 9px;

    cursor: pointer;

}

.edit {

    background: var(--border);

    color: var(--text);

}

.delete {

    background: #ffe5e5;

    color: #c62828;

}

.center {

    text-align: center;

    color: var(--muted);

    padding: 25px;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 450px) {

    .summary {

        grid-template-columns: 1fr;

    }

    .header h1 {

        font-size: 30px;

    }

}

</style>

</head>

</div>

function showMonth() {

    const name =
        months[
            currentMonth.getMonth()
        ];


    const year =
        currentMonth.getFullYear() + 543;


    document.getElementById(
        "monthText"
    ).textContent =
        name + " " + year;

}


function previousMonth() {

    currentMonth.setMonth(
        currentMonth.getMonth() - 1
    );

    showMonth();

    load();

}


function nextMonth() {

    currentMonth.setMonth(
        currentMonth.getMonth() + 1
    );

    showMonth();

    load();

}


/* =====================================================
   ช่วงเดือน
   V3 เดิม — ไม่เปลี่ยน
===================================================== */

function monthRange() {

    const year =
        currentMonth.getFullYear();


    const month =
        currentMonth.getMonth();


    const start =
        year +
        "-" +
        String(
            month + 1
        ).padStart(
            2,
            "0"
        ) +
        "-01";


    const next =
        new Date(
            year,
            month + 1,
            1
        );


    const end =
        next.getFullYear() +
        "-" +
        String(
            next.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +
        "-01";


    return {
        start,
        end
    };

}

   Login

async function login() {

    const session =
        await db.auth.getSession();


    if (
        session.data.session
    ) {

        return true;

    }


    const result =
        await db.auth
            .signInAnonymously();


    if (
        result.error
    ) {

        alert(
            "Login ไม่สำเร็จ: " +
            result.error.message
        );

        return false;

    }


    return true;

}

    editingId = null;

    document.getElementById(

    document.getElementById(

    document.getElementById(

    ).value =
        "";


    setToday();


    document.getElementById(
        "form"
    ).style.display =
        "block";

}


function closeForm() {

    document.getElementById(
        "form"
    ).style.display =
        "none";


    editingId = null;

}


function setToday() {

    const d =
        new Date();


    const year =
        d.getFullYear();


    const month =
        String(
            d.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            d.getDate()
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "date"
    ).value =
        year +
        "-" +
        month +
        "-" +
        day;

}

   บันทึก

        return;

    let result;


    if (editingId) {

            await db

                .update({

                .eq(

                    user.id

        result =

                .from("transactions")
                .insert({

                    type: type,

                    amount: amount,

                    description: description,

                    transaction_date:
                        date

                });

    if (
        result.error
    ) {

        alert(
            "บันทึกไม่สำเร็จ: " +
            result.error.message
        );

        return;

    }


    closeForm();

    load();

}
