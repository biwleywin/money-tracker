<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Money Tracker</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            font-size: 34px;
            margin: 10px 0 25px;
        }

        /* เดือน */
        .month-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 15px;
            border-radius: 14px;
            margin-bottom: 15px;
        }

        .month-selector button {
            width: 45px;
            height: 42px;
            padding: 0;
            background: #f0f0f0;
            color: #222;
            font-size: 22px;
        }

        #monthLabel {
            font-size: 19px;
            font-weight: bold;
        }

        /* สรุป */
        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .card small {
            color: #777;
        }

        .card strong {
            display: block;
            margin-top: 8px;
            font-size: 18px;
        }

        .income {
            color: #16803c;
        }

        .expense {
            color: #d62828;
        }

        /* ปุ่ม */
        button {
            border: 0;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        .add-btn {
            width: 100%;
            padding: 15px;
            background: #111;
            color: white;
            margin-bottom: 20px;
        }

        /* Form */
        .form {
            display: none;
            background: white;
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .form h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }

        .save-btn {
            width: 100%;
            background: #16803c;
            color: white;
            padding: 14px;
            margin-top: 18px;
        }

        .cancel-btn {
            width: 100%;
            background: #eee;
            padding: 14px;
            margin-top: 8px;
        }

        /* รายการ */
        .transaction {
            background: white;
            padding: 15px;
            border-radius: 13px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .transaction-info {
            min-width: 0;
        }

        .transaction-info strong {
            display: block;
            font-size: 16px;
        }

        .transaction-info small {
            display: block;
            color: #777;
            margin-top: 5px;
            word-break: break-word;
        }

        .amount {
            font-weight: bold;
            white-space: nowrap;
        }

        .loading,
        .empty {
            text-align: center;
            color: #777;
            padding: 30px 10px;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        @media (max-width: 450px) {

            .summary {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💰 Money Tracker</h1>

    <!-- เลือกเดือน -->
    <div class="month-selector">

        <button onclick="changeMonth(-1)">
            ‹
        </button>

        <div id="monthLabel">
            กำลังโหลด...
        </div>

        <button onclick="changeMonth(1)">
            ›
        </button>

    </div>


    <!-- สรุป -->
    <div class="summary">

        <div class="card">
            <small>รายรับ</small>

            <strong
                class="income"
                id="income">
                ฿0
            </strong>
        </div>


        <div class="card">
            <small>รายจ่าย</small>

            <strong
                class="expense"
                id="expense">
                ฿0
            </strong>
        </div>


        <div class="card">
            <small>คงเหลือ</small>

            <strong id="balance">
                ฿0
            </strong>
        </div>

    </div>


    <!-- เพิ่มรายการ -->
    <button
        class="add-btn"
        onclick="showForm()">

        ＋ เพิ่มรายการ

    </button>


    <!-- Form -->
    <div
        class="form"
        id="form">

        <h2>เพิ่มรายการ</h2>


        <label>
            ประเภท
        </label>

        <select id="type">

            <option value="income">
                รายรับ
            </option>

            <option value="expense">
                รายจ่าย
            </option>

        </select>


        <label>
            จำนวนเงิน
        </label>

        <input
            id="amount"
            type="number"
            placeholder="เช่น 500"
            min="0"
            step="0.01"
        >


        <label>
            หมวดหมู่
        </label>

        <select id="category">

            <option value="Food">
                อาหาร
            </option>

            <option value="Transport">
                เดินทาง
            </option>

            <option value="Gaming">
                เกม
            </option>

            <option value="Roblox">
                Roblox
            </option>

            <option value="Shopping">
                ซื้อของ
            </option>

            <option value="Salary">
                เงินเดือน
            </option>

            <option value="Other">
                อื่น ๆ
            </option>

        </select>


        <label>
            รายละเอียด
        </label>

        <input
            id="description"
            type="text"
            placeholder="เช่น ขายไอเทม"
        >


        <label>
            วันที่
        </label>

        <input
            id="date"
            type="date"
        >


        <button
            class="save-btn"
            onclick="saveTransaction()">

            บันทึก

        </button>


        <button
            class="cancel-btn"
            onclick="hideForm()">

            ยกเลิก

        </button>

    </div>


    <h2>
        รายการในเดือนนี้
    </h2>


    <div id="transactions">

        <div class="loading">
            กำลังโหลด...
        </div>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://sbiziifpybyzljikjnrh.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_aD38PwfPHzSYU83kIbmnEg_rHVMgomF";

const client =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   เดือนปัจจุบัน
========================= */

let selectedMonth = new Date();

selectedMonth.setDate(1);


/* =========================
   ชื่อเดือนภาษาไทย
========================= */

const thaiMonths = [
    "มกราคม",
    "กุมภาพันธ์",
    "มีนาคม",
    "เมษายน",
    "พฤษภาคม",
    "มิถุนายน",
    "กรกฎาคม",
    "สิงหาคม",
    "กันยายน",
    "ตุลาคม",
    "พฤศจิกายน",
    "ธันวาคม"
];


function updateMonthLabel() {

    const month =
        thaiMonths[selectedMonth.getMonth()];

    const year =
        selectedMonth.getFullYear() + 543;

    document.getElementById("monthLabel")
        .textContent =
        `${month} ${year}`;
}


/* =========================
   เปลี่ยนเดือน
========================= */

function changeMonth(amount) {

    selectedMonth.setMonth(
        selectedMonth.getMonth() + amount
    );

    updateMonthLabel();

    loadTransactions();

}


/* =========================
   ช่วงวันที่ของเดือน
========================= */

function getMonthRange() {

    const year =
        selectedMonth.getFullYear();

    const month =
        selectedMonth.getMonth();


    const start =
        `${year}-${String(month + 1).padStart(2, "0")}-01`;


    const nextMonth =
        new Date(year, month + 1, 1);


    const end =
        `${nextMonth.getFullYear()}-${String(
            nextMonth.getMonth() + 1
        ).padStart(2, "0")}-01`;


    return {
        start,
        end
    };

}


/* =========================
   Login
========================= */

async function login() {

    const {
        data: sessionData
    } = await client.auth.getSession();


    if (sessionData.session) {

        return;

    }


    const {
        error
    } =
        await client.auth.signInAnonymously();


    if (error) {

        console.error(error);

        alert(
            "Login ไม่สำเร็จ: "
            + error.message
        );

    }

}


/* =========================
   เปิด Form
========================= */

function showForm() {

    document.getElementById("form")
        .style.display = "block";

}


/* =========================
   ปิด Form
========================= */

function hideForm() {

    document.getElementById("form")
        .style.display = "none";

}


/* =========================
   บันทึกรายการ
========================= */

async function saveTransaction() {

    const type =
        document.getElementById("type").value;


    const amount =
        Number(
            document.getElementById("amount").value
        );


    const category =
        document.getElementById("category").value;


    const description =
        document.getElementById("description").value
            .trim();


    const date =
        document.getElementById("date").value;


    if (!amount || amount <= 0) {

        alert("กรอกจำนวนเงินก่อน");

        return;

    }


    if (!date) {

        alert("เลือกวันที่ก่อน");

        return;

    }


    const {
        data: {
            user
        }
    } =
        await client.auth.getUser();


    if (!user) {

        alert("ไม่พบ User");

        return;

    }


    const {
        error
    } =
        await client
            .from("transactions")
            .insert({

                user_id: user.id,

                type: type,

                amount: amount,

                category: category,

                description: description,

                transaction_date: date

            });


    if (error) {

        console.error(error);

        alert(
            "บันทึกไม่สำเร็จ: "
            + error.message
        );

        return;

    }


    document.getElementById("amount")
        .value = "";


    document.getElementById("description")
        .value = "";


    hideForm();


    loadTransactions();

}


/* =========================
   โหลดรายการของเดือน
========================= */

async function loadTransactions() {

    const container =
        document.getElementById("transactions");


    container.innerHTML =
        `<div class="loading">
            กำลังโหลด...
        </div>`;


    const {
        start,
        end
    } =
        getMonthRange();


    const {
        data,
        error
    } =
        await client
            .from("transactions")
            .select("*")
            .gte(
                "transaction_date",
                start
            )
            .lt(
                "transaction_date",
                end
            )
            .order(
                "transaction_date",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);

        container.innerHTML =
            `<div class="error">
                โหลดข้อมูลไม่ได้
            </div>`;

        return;

    }


    let income = 0;

    let expense = 0;


    container.innerHTML = "";


    if (!data || data.length === 0) {

        container.innerHTML =
            `<div class="empty">
                ไม่มีรายการในเดือนนี้
            </div>`;

        updateSummary(
            0,
            0
        );

        return;

    }


    data.forEach(item => {

        const amount =
            Number(item.amount);


        if (item.type === "income") {

            income += amount;

        } else {

            expense += amount;

        }


        const div =
            document.createElement("div");


        div.className =
            "transaction";


        const sign =
            item.type === "income"
                ? "+"
                : "-";


        const color =
            item.type === "income"
                ? "income"
                : "expense";


        div.innerHTML = `

            <div class="transaction-info">

                <strong>
                    ${escapeHtml(item.category)}
                </strong>

                <small>
                    ${escapeHtml(
                        item.description || ""
                    )}
                </small>

                <small>
                    ${formatDate(
                        item.transaction_date
                    )}
                </small>

            </div>


            <div class="amount ${color}">
                ${sign}฿${amount.toLocaleString(
                    "th-TH"
                )}
            </div>

        `;


        container.appendChild(div);

    });


    updateSummary(
        income,
        expense
    );

}


/* =========================
   Summary
========================= */

function updateSummary(
    income,
    expense
) {

    document.getElementById("income")
        .textContent =
        "฿" +
        income.toLocaleString("th-TH");


    document.getElementById("expense")
        .textContent =
        "฿" +
        expense.toLocaleString("th-TH");


    document.getElementById("balance")
        .textContent =
        "฿" +
        (
            income - expense
        ).toLocaleString("th-TH");

}


/* =========================
   วันที่
========================= */

function formatDate(dateString) {

    const [
        year,
        month,
        day
    ] =
        dateString.split("-");


    return `${day}/${month}/${Number(year) + 543}`;

}


/* =========================
   ป้องกัน HTML แปลก ๆ
========================= */

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================
   วันที่เริ่มต้น
========================= */

function setDefaultDate() {

    const today =
        new Date();


    const year =
        today.getFullYear();


    const month =
        String(
            today.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            today.getDate()
        ).padStart(2, "0");


    document.getElementById("date")
        .value =
        `${year}-${month}-${day}`;

}


/* =========================
   เริ่มระบบ
========================= */

async function start() {

    updateMonthLabel();

    setDefaultDate();

    await login();

    await loadTransactions();

}


start();

</script>

</body>
</html>
