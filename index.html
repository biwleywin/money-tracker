<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #101214;
    color: #f1f1f1;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

h1 {
    margin: 10px 0 20px;
    font-size: 32px;
}

h2 {
    margin-top: 25px;
}


/* =====================================================
   MONTH
===================================================== */

.month {
    background: #1b1e22;
    border-radius: 14px;

    padding: 12px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 15px;
}

.month button {
    width: 45px;
    height: 42px;

    border: 0;
    border-radius: 10px;

    background: #30343a;
    color: #ffffff;

    font-size: 24px;

    cursor: pointer;
}

.month button:active {
    transform: scale(0.96);
}

#monthText {
    font-size: 18px;
    font-weight: bold;
}


/* =====================================================
   SUMMARY
===================================================== */

.summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.card {
    background: #1b1e22;
    border-radius: 14px;
    padding: 15px;
}

.card small {
    color: #999999;
}

.card strong {
    display: block;
    margin-top: 8px;
    font-size: 19px;
}

.green {
    color: #35c76f;
}

.red {
    color: #ff5757;
}


/* =====================================================
   ADD BUTTON
===================================================== */

.add {
    width: 100%;

    margin-top: 15px;
    padding: 15px;

    border: 0;
    border-radius: 12px;

    background: #f1f1f1;
    color: #111111;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
}

.add:active {
    transform: scale(0.99);
}


/* =====================================================
   FORM
===================================================== */

.form {
    display: none;

    margin-top: 15px;
    padding: 18px;

    background: #1b1e22;

    border-radius: 14px;
}

.form h2 {
    margin-top: 0;
}

label {
    display: block;

    margin-top: 12px;
    margin-bottom: 5px;

    font-size: 14px;
}

input,
select {
    width: 100%;

    padding: 12px;

    border: 1px solid #3a3f45;
    border-radius: 10px;

    background: #25292e;
    color: #f1f1f1;

    font-size: 16px;
}

input::placeholder {
    color: #777777;
}

.save {
    width: 100%;

    margin-top: 18px;
    padding: 13px;

    border: 0;
    border-radius: 10px;

    background: #16803c;
    color: #ffffff;

    font-size: 16px;

    cursor: pointer;
}

.cancel {
    width: 100%;

    margin-top: 8px;
    padding: 13px;

    border: 0;
    border-radius: 10px;

    background: #30343a;
    color: #ffffff;

    font-size: 16px;

    cursor: pointer;
}


/* =====================================================
   ANALYSIS
===================================================== */

.analysis {
    margin-top: 20px;
    padding: 18px;

    background: #1b1e22;

    border-radius: 14px;
}

.analysis-title {
    margin-bottom: 15px;

    font-size: 18px;
    font-weight: bold;
}

.category {
    margin-bottom: 15px;
}

.category-top {
    display: flex;
    justify-content: space-between;

    margin-bottom: 6px;

    font-size: 14px;
}

.bar-bg {
    height: 8px;

    background: #30343a;

    border-radius: 20px;

    overflow: hidden;
}

.bar {
    height: 100%;

    background: #f1f1f1;

    border-radius: 20px;
}


/* =====================================================
   TRANSACTIONS
===================================================== */

.transaction {
    margin-bottom: 10px;
    padding: 15px;

    background: #1b1e22;

    border-radius: 13px;
}

.transaction-main {
    display: flex;
    justify-content: space-between;

    gap: 10px;
}

.transaction-name {
    font-weight: bold;
}

.transaction-detail {
    margin-top: 5px;

    color: #999999;

    font-size: 14px;
}

.transaction-amount {
    font-weight: bold;
    white-space: nowrap;
}

.actions {
    display: flex;
    gap: 8px;

    margin-top: 12px;
    padding-top: 10px;

    border-top: 1px solid #30343a;
}

.edit,
.delete {
    flex: 1;

    padding: 9px;

    border: 0;
    border-radius: 9px;

    cursor: pointer;
}

.edit {
    background: #30343a;
    color: #ffffff;
}

.delete {
    background: #4a2525;
    color: #ff6b6b;
}


/* =====================================================
   LOADING
===================================================== */

.center {
    padding: 25px;

    text-align: center;

    color: #999999;
}


/* =====================================================
   ERROR
===================================================== */

.error {
    margin-top: 15px;
    padding: 15px;

    background: #3a2020;

    border-radius: 12px;

    color: #ff7777;

    word-break: break-word;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 450px) {

    .summary {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 30px;
    }

}

</style>

<script>

(function () {

        "ตุลาคม",

        "ธันวาคม"
    ];

    const now = new Date();

    const month =
        months[now.getMonth()];

    const year =
        now.getFullYear() + 543;

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            const element =
                document.getElementById(
                    "monthText"
                );

            if (element) {

                element.textContent =
                    month + " " + year;

            }

        }
    );

})();

</script>

/* =====================================================

function showMonth() {

    const monthName =
        months[
            currentMonth.getMonth()
        ];

    const year =
        currentMonth.getFullYear() + 543;

    const element =
        document.getElementById(
            "monthText"
        );

    element.textContent =

/* =====================================================
   MONTH NAVIGATION
===================================================== */

function previousMonth() {

    currentMonth.setMonth(
        currentMonth.getMonth() - 1
    );

    showMonth();

    load();

}


function nextMonth() {

    currentMonth.setMonth(
        currentMonth.getMonth() + 1
    );

    showMonth();

    load();

}


/* =====================================================
   MONTH RANGE
===================================================== */

function monthRange() {

    const year =
        currentMonth.getFullYear();

    const month =
        currentMonth.getMonth();


    const start =
        year +
        "-" +
        String(
            month + 1
        ).padStart(
            2,
            "0"
        ) +
        "-01";


    const nextMonthDate =
        new Date(
            year,
            month + 1,
            1
        );


    const end =
        nextMonthDate.getFullYear() +
        "-" +
        String(
            nextMonthDate.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +
        "-01";


    return {
        start,
        end
    };

}


/* =====================================================
   INITIALIZE SUPABASE
===================================================== */

function initializeSupabase() {

    if (
        typeof supabase ===
        "undefined"
    ) {

        showError(
            "Supabase โหลดไม่สำเร็จ",
            "ไม่พบ Supabase JavaScript library"
        );

        return false;

    }


    try {

        db =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        return true;

    } catch (error) {

        showError(
            "สร้าง Supabase Client ไม่สำเร็จ",
            error.message
        );

        return false;

    }

}


/* =====================================================
   LOGIN
===================================================== */

async function login() {

    if (!db) {

        return false;

    }


    try {

        const sessionResult =
            await db.auth.getSession();


        if (
            sessionResult.data &&
            sessionResult.data.session
        ) {

            return true;

        }


        const result =
            await db.auth
                .signInAnonymously();


        if (result.error) {

            showError(
                "Login ไม่สำเร็จ",
                result.error.message
            );

            return false;

        }


        return true;

    } catch (error) {

        showError(
            "Login เกิดข้อผิดพลาด",
            error.message
        );

        return false;

    }

}

function setToday() {

    const d =
        new Date();


    const year =
        d.getFullYear();


    const month =
        String(
            d.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            d.getDate()
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "date"
    ).value =
        year +
        "-" +
        month +
        "-" +
        day;

}
