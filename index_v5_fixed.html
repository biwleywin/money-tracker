<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Money Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-width:0}
body{min-height:100vh;background:#101214;color:#f1f1f1;font-family:Arial,"Noto Sans Thai",sans-serif;overflow-x:hidden}
button,input,select{font:inherit}button{cursor:pointer}
.container{width:100%;max-width:600px;margin:0 auto;padding:20px}
h1{margin:8px 0 20px;font-size:32px}h2{margin:25px 0 12px;font-size:21px}
.month{width:100%;min-height:66px;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#1b1e22;border-radius:14px;margin-bottom:15px}
.month button{width:45px;height:42px;border:0;border-radius:10px;background:#30343a;color:#fff;font-size:25px}
.month button:active,.add:active{transform:scale(.97)}
#monthText{font-size:18px;font-weight:bold;text-align:center}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{min-width:0;padding:15px;background:#1b1e22;border-radius:14px}.card small{color:#999}.card strong{display:block;margin-top:8px;font-size:19px;overflow-wrap:anywhere}
.green{color:#35c76f}.red{color:#ff5757}
.add{width:100%;margin-top:15px;padding:15px;border:0;border-radius:12px;background:#f1f1f1;color:#111;font-size:16px;font-weight:bold}
.form{display:none;margin-top:15px;padding:18px;background:#1b1e22;border-radius:14px}.form h2{margin-top:0}
label{display:block;margin-top:12px;margin-bottom:6px;color:#aaa;font-size:14px}
input,select{width:100%;padding:12px;border:1px solid #3a3f45;border-radius:10px;outline:none;background:#25292e;color:#f1f1f1;font-size:16px}
input:focus,select:focus{border-color:#777}input::placeholder{color:#777}
.save,.cancel{width:100%;padding:13px;border:0;border-radius:10px}.save{margin-top:18px;background:#16803c;color:#fff;font-weight:bold}.cancel{margin-top:8px;background:#30343a;color:#fff}
.filters{margin-top:20px;padding:16px;background:#1b1e22;border-radius:14px}.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.filter-reset{width:100%;margin-top:10px;padding:10px;border:0;border-radius:9px;background:#30343a;color:#fff}.result-count{margin-top:12px;color:#888;font-size:13px}
.analysis{margin-top:20px;padding:18px;background:#1b1e22;border-radius:14px}.analysis-title{margin-bottom:15px;font-size:18px;font-weight:bold}
.category{margin-bottom:15px}.category-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px;font-size:14px}.bar-bg{width:100%;height:8px;overflow:hidden;background:#30343a;border-radius:20px}.bar{height:100%;background:#f1f1f1;border-radius:20px}
.transaction{margin-bottom:10px;padding:15px;background:#1b1e22;border-radius:13px}.transaction-main{display:flex;justify-content:space-between;gap:12px}.transaction-left{min-width:0}.transaction-name{font-weight:bold;overflow-wrap:anywhere}.transaction-detail{margin-top:5px;color:#999;font-size:14px;overflow-wrap:anywhere}.transaction-amount{flex-shrink:0;font-weight:bold;white-space:nowrap}
.actions{display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid #30343a}.edit,.delete{flex:1;padding:9px;border:0;border-radius:9px}.edit{background:#30343a;color:#fff}.delete{background:#4a2525;color:#ff6b6b}
.center{padding:25px;text-align:center;color:#999}.error{margin-top:15px;padding:15px;background:#3a2020;border-radius:12px;color:#ff7777;word-break:break-word}
@media(max-width:450px){.container{padding:16px}h1{font-size:30px}.summary{grid-template-columns:1fr}.filter-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>💰 Money Tracker</h1>

<div class="month">
<button id="prevBtn" type="button">‹</button>
<div id="monthText"></div>
<button id="nextBtn" type="button">›</button>
</div>

<div class="summary">
<div class="card"><small>รายรับ</small><strong id="income" class="green">฿0</strong></div>
<div class="card"><small>รายจ่าย</small><strong id="expense" class="red">฿0</strong></div>
<div class="card"><small>คงเหลือ</small><strong id="balance">฿0</strong></div>
</div>

<button id="addBtn" class="add" type="button">＋ เพิ่มรายการ</button>

<div id="form" class="form">
<h2 id="formTitle">เพิ่มรายการ</h2>
<label>ประเภท</label>
<select id="type"><option value="income">รายรับ</option><option value="expense">รายจ่าย</option></select>
<label>จำนวนเงิน</label>
<input id="amount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="เช่น 500">
<label>หมวดหมู่</label>
<select id="category">
<option value="Food">อาหาร</option><option value="Transport">เดินทาง</option><option value="Gaming">เกม</option><option value="Roblox">Roblox</option><option value="Shopping">ซื้อของ</option><option value="Salary">เงินเดือน</option><option value="Other">อื่น ๆ</option>
</select>
<label>รายละเอียด</label>
<input id="description" type="text" maxlength="200" placeholder="เช่น ขายไอเทม">
<label>วันที่</label>
<input id="date" type="date">
<button id="saveBtn" class="save" type="button">บันทึก</button>
<button id="cancelBtn" class="cancel" type="button">ยกเลิก</button>
</div>

<div class="filters">
<input id="search" type="search" placeholder="🔎 ค้นหารายการ..." autocomplete="off">
<div class="filter-grid">
<select id="typeFilter"><option value="all">ทุกประเภท</option><option value="income">รายรับ</option><option value="expense">รายจ่าย</option></select>
<select id="categoryFilter"><option value="all">ทุกหมวด</option><option value="Food">อาหาร</option><option value="Transport">เดินทาง</option><option value="Gaming">เกม</option><option value="Roblox">Roblox</option><option value="Shopping">ซื้อของ</option><option value="Salary">เงินเดือน</option><option value="Other">อื่น ๆ</option></select>
</div>
<label>เรียงรายการ</label>
<select id="sort"><option value="date_desc">ใหม่ → เก่า</option><option value="date_asc">เก่า → ใหม่</option><option value="amount_desc">จำนวนเงินมาก → น้อย</option><option value="amount_asc">จำนวนเงินน้อย → มาก</option></select>
<button id="resetBtn" class="filter-reset" type="button">รีเซ็ตตัวกรอง</button>
<div id="resultCount" class="result-count">0 รายการ</div>
</div>

<div class="analysis"><div class="analysis-title">📊 สรุปรายจ่ายตามหมวด</div><div id="expenseAnalysis"><div class="center">ยังไม่มีรายจ่าย</div></div></div>
<div class="analysis"><div class="analysis-title">💰 สรุปรายรับตามหมวด</div><div id="incomeAnalysis"><div class="center">ยังไม่มีรายรับ</div></div></div>

<h2>รายการในเดือนนี้</h2>
<div id="transactions"><div class="center">กำลังเชื่อมต่อฐานข้อมูล...</div></div>
</div>

<script>
"use strict";

/* =========================
   CONFIG
========================= */
const SUPABASE_URL = "https://sbiziifpybyzljikjnrh.supabase.co";
const SUPABASE_KEY = "sb_publishable_aD38PwfPHzSYU83kIbmnEg_rHVMgomF";

/* =========================
   STATE
========================= */
let db = null;
let currentMonth = new Date();
currentMonth.setDate(1);
let transactions = [];
let editingId = null;
let databaseReady = false;

const months = [
  "มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน",
  "กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"
];

/* =========================
   DOM
========================= */
const monthText = document.getElementById("monthText");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const addBtn = document.getElementById("addBtn");
const form = document.getElementById("form");
const formTitle = document.getElementById("formTitle");
const type = document.getElementById("type");
const amount = document.getElementById("amount");
const category = document.getElementById("category");
const description = document.getElementById("description");
const date = document.getElementById("date");
const saveBtn = document.getElementById("saveBtn");
const cancelBtn = document.getElementById("cancelBtn");
const search = document.getElementById("search");
const typeFilter = document.getElementById("typeFilter");
const categoryFilter = document.getElementById("categoryFilter");
const sort = document.getElementById("sort");
const resetBtn = document.getElementById("resetBtn");
const transactionsBox = document.getElementById("transactions");
const resultCount = document.getElementById("resultCount");
const incomeBox = document.getElementById("income");
const expenseBox = document.getElementById("expense");
const balanceBox = document.getElementById("balance");
const expenseAnalysis = document.getElementById("expenseAnalysis");
const incomeAnalysis = document.getElementById("incomeAnalysis");

/* =========================
   UI FIRST
========================= */
function updateMonthText() {
  const name = months[currentMonth.getMonth()];
  const year = currentMonth.getFullYear() + 543;
  monthText.textContent = name + " " + year;
}

function todayString() {
  const d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

function openForm() {
  editingId = null;
  formTitle.textContent = "เพิ่มรายการ";
  type.value = "income";
  amount.value = "";
  category.value = "Food";
  description.value = "";
  date.value = todayString();
  form.style.display = "block";
  form.scrollIntoView({behavior:"smooth", block:"start"});
  setTimeout(() => amount.focus(), 150);
}

function closeForm() {
  form.style.display = "none";
  editingId = null;
}

updateMonthText();
date.value = todayString();

/* =========================
   UI EVENTS
========================= */
addBtn.addEventListener("click", openForm);
cancelBtn.addEventListener("click", closeForm);

prevBtn.addEventListener("click", async () => {
  currentMonth.setMonth(currentMonth.getMonth() - 1);
  updateMonthText();
  if (databaseReady) await loadTransactions();
});

nextBtn.addEventListener("click", async () => {
  currentMonth.setMonth(currentMonth.getMonth() + 1);
  updateMonthText();
  if (databaseReady) await loadTransactions();
});

search.addEventListener("input", applyFilters);
typeFilter.addEventListener("change", applyFilters);
categoryFilter.addEventListener("change", applyFilters);
sort.addEventListener("change", applyFilters);

resetBtn.addEventListener("click", () => {
  search.value = "";
  typeFilter.value = "all";
  categoryFilter.value = "all";
  sort.value = "date_desc";
  applyFilters();
});

/* =========================
   SUPABASE
========================= */
async function initializeDatabase() {
  try {
    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      throw new Error("Supabase JavaScript โหลดไม่สำเร็จ");
    }

    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const sessionResult = await db.auth.getSession();
    if (sessionResult.error) throw sessionResult.error;

    if (!sessionResult.data.session) {
      const loginResult = await db.auth.signInAnonymously();
      if (loginResult.error) throw loginResult.error;
    }

    databaseReady = true;
    await loadTransactions();
  } catch (error) {
    databaseReady = false;
    transactionsBox.innerHTML =
      '<div class="error"><strong>เชื่อมต่อฐานข้อมูลไม่ได้</strong><br><br>' +
      escapeHtml(error.message || "Unknown error") +
      '<br><br>ตรวจสอบ Supabase แล้วลองรีเฟรชหน้าเว็บ</div>';
  }
}

function getMonthRange() {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();
  const start = year + "-" + String(month + 1).padStart(2, "0") + "-01";
  const next = new Date(year, month + 1, 1);
  const end = next.getFullYear() + "-" +
    String(next.getMonth() + 1).padStart(2, "0") + "-01";
  return {start, end};
}

async function loadTransactions() {
  if (!db) return;

  transactionsBox.innerHTML = '<div class="center">กำลังโหลด...</div>';

  try {
    const range = getMonthRange();
    const result = await db
      .from("transactions")
      .select("*")
      .gte("transaction_date", range.start)
      .lt("transaction_date", range.end)
      .order("transaction_date", {ascending:false});

    if (result.error) throw result.error;

    transactions = Array.isArray(result.data) ? result.data : [];
    renderAll();
  } catch (error) {
    transactions = [];
    updateSummary();
    renderAnalysis();
    resultCount.textContent = "0 รายการ";
    transactionsBox.innerHTML =
      '<div class="error"><strong>โหลดข้อมูลไม่ได้</strong><br><br>' +
      escapeHtml(error.message || "Unknown error") + '</div>';
  }
}

/* =========================
   SAVE
========================= */
saveBtn.addEventListener("click", saveTransaction);

async function saveTransaction() {
  if (!databaseReady || !db) {
    alert("ฐานข้อมูลยังไม่พร้อม ลองรอสักครู่แล้วกดใหม่");
    return;
  }

  const amountValue = Number(amount.value);

  if (!Number.isFinite(amountValue) || amountValue <= 0) {
    alert("กรอกจำนวนเงินให้ถูกต้อง");
    amount.focus();
    return;
  }

  if (!date.value) {
    alert("เลือกวันที่ก่อน");
    return;
  }

  saveBtn.disabled = true;
  saveBtn.textContent = "กำลังบันทึก...";

  try {
    const userResult = await db.auth.getUser();
    if (userResult.error) throw userResult.error;
    if (!userResult.data.user) throw new Error("ไม่พบ User");

    const payload = {
      type: type.value,
      amount: amountValue,
      category: category.value,
      description: description.value.trim(),
      transaction_date: date.value
    };

    let result;

    if (editingId) {
      result = await db
        .from("transactions")
        .update(payload)
        .eq("id", editingId)
        .eq("user_id", userResult.data.user.id);
    } else {
      result = await db
        .from("transactions")
        .insert({
          user_id: userResult.data.user.id,
          ...payload
        });
    }

    if (result.error) throw result.error;

    closeForm();
    await loadTransactions();
  } catch (error) {
    alert("บันทึกไม่สำเร็จ: " + (error.message || "Unknown error"));
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = "บันทึก";
  }
}

/* =========================
   SUMMARY / ANALYSIS
========================= */
function updateSummary() {
  let income = 0;
  let expense = 0;

  transactions.forEach(item => {
    const value = Number(item.amount) || 0;
    if (item.type === "income") income += value;
    else expense += value;
  });

  const balance = income - expense;

  incomeBox.textContent = "฿" + income.toLocaleString("th-TH");
  expenseBox.textContent = "฿" + expense.toLocaleString("th-TH");
  balanceBox.textContent = "฿" + balance.toLocaleString("th-TH");

  balanceBox.classList.remove("green", "red");
  balanceBox.classList.add(balance < 0 ? "red" : "green");
}

function renderAnalysis() {
  const incomeCategories = {};
  const expenseCategories = {};

  transactions.forEach(item => {
    const value = Number(item.amount) || 0;
    const target = item.type === "income" ? incomeCategories : expenseCategories;
    target[item.category] = (target[item.category] || 0) + value;
  });

  renderCategoryBox(expenseCategories, expenseAnalysis, "ยังไม่มีรายจ่าย");
  renderCategoryBox(incomeCategories, incomeAnalysis, "ยังไม่มีรายรับ");
}

function renderCategoryBox(data, element, emptyText) {
  element.innerHTML = "";
  const keys = Object.keys(data);

  if (!keys.length) {
    element.innerHTML = '<div class="center">' + emptyText + '</div>';
    return;
  }

  let total = 0;
  keys.forEach(key => total += Number(data[key]) || 0);
  keys.sort((a,b) => data[b] - data[a]);

  keys.forEach(key => {
    const value = Number(data[key]) || 0;
    const percent = total > 0 ? (value / total) * 100 : 0;
    const row = document.createElement("div");
    row.className = "category";
    row.innerHTML =
      '<div class="category-top"><span>' +
      escapeHtml(categoryName(key)) +
      '</span><span>฿' +
      value.toLocaleString("th-TH") +
      ' · ' + percent.toFixed(1) + '%</span></div>' +
      '<div class="bar-bg"><div class="bar" style="width:' +
      Math.min(percent,100) + '%"></div></div>';
    element.appendChild(row);
  });
}

/* =========================
   FILTER / RENDER
========================= */
function applyFilters() {
  const keyword = search.value.trim().toLowerCase();

  let result = transactions.filter(item => {
    const desc = String(item.description || "").toLowerCase();
    const cat = String(item.category || "").toLowerCase();
    const thaiCat = categoryName(item.category).toLowerCase();

    const searchMatch =
      !keyword ||
      desc.includes(keyword) ||
      cat.includes(keyword) ||
      thaiCat.includes(keyword);

    const typeMatch =
      typeFilter.value === "all" ||
      item.type === typeFilter.value;

    const categoryMatch =
      categoryFilter.value === "all" ||
      item.category === categoryFilter.value;

    return searchMatch && typeMatch && categoryMatch;
  });

  result.sort((a,b) => {
    if (sort.value === "amount_desc") return Number(b.amount) - Number(a.amount);
    if (sort.value === "amount_asc") return Number(a.amount) - Number(b.amount);
    if (sort.value === "date_asc")
      return String(a.transaction_date).localeCompare(String(b.transaction_date));
    return String(b.transaction_date).localeCompare(String(a.transaction_date));
  });

  renderTransactions(result);
  resultCount.textContent = result.length + " รายการ";
}

function renderTransactions(data) {
  transactionsBox.innerHTML = "";

  if (!data.length) {
    transactionsBox.innerHTML = '<div class="center">ไม่มีรายการ</div>';
    return;
  }

  data.forEach(item => {
    const box = document.createElement("div");
    box.className = "transaction";

    const value = Number(item.amount) || 0;
    const isIncome = item.type === "income";

    box.innerHTML =
      '<div class="transaction-main">' +
        '<div class="transaction-left">' +
          '<div class="transaction-name">' +
            escapeHtml(categoryName(item.category)) +
          '</div>' +
          '<div class="transaction-detail">' +
            escapeHtml(item.description || "") +
          '</div>' +
          '<div class="transaction-detail">' +
            formatDate(item.transaction_date) +
          '</div>' +
        '</div>' +
        '<div class="transaction-amount ' +
          (isIncome ? "green" : "red") + '">' +
          (isIncome ? "+" : "-") +
          "฿" + value.toLocaleString("th-TH") +
        '</div>' +
      '</div>' +
      '<div class="actions">' +
        '<button class="edit" type="button" data-edit="' +
          escapeAttribute(item.id) + '">✏️ แก้ไข</button>' +
        '<button class="delete" type="button" data-delete="' +
          escapeAttribute(item.id) + '">🗑️ ลบ</button>' +
      '</div>';

    transactionsBox.appendChild(box);
  });
}

/* =========================
   EDIT / DELETE
========================= */
transactionsBox.addEventListener("click", async event => {
  const editButton = event.target.closest("[data-edit]");
  if (editButton) {
    await editTransaction(editButton.dataset.edit);
    return;
  }

  const deleteButton = event.target.closest("[data-delete]");
  if (deleteButton) {
    await deleteTransaction(deleteButton.dataset.delete);
  }
});

async function editTransaction(id) {
  if (!db) return;

  try {
    const result = await db
      .from("transactions")
      .select("*")
      .eq("id", id)
      .single();

    if (result.error) throw result.error;

    const item = result.data;
    editingId = id;

    formTitle.textContent = "แก้ไขรายการ";
    type.value = item.type;
    amount.value = item.amount;
    category.value = item.category;
    description.value = item.description || "";
    date.value = item.transaction_date;

    form.style.display = "block";
    form.scrollIntoView({behavior:"smooth", block:"start"});
  } catch (error) {
    alert("เปิดรายการไม่ได้: " + (error.message || "Unknown error"));
  }
}

async function deleteTransaction(id) {
  if (!confirm("ลบรายการนี้ใช่ไหม?")) return;
  if (!db) return;

  try {
    const result = await db
      .from("transactions")
      .delete()
      .eq("id", id);

    if (result.error) throw result.error;
    await loadTransactions();
  } catch (error) {
    alert("ลบไม่สำเร็จ: " + (error.message || "Unknown error"));
  }
}

/* =========================
   HELPERS
========================= */
function categoryName(value) {
  const names = {
    Food:"อาหาร",
    Transport:"เดินทาง",
    Gaming:"เกม",
    Roblox:"Roblox",
    Shopping:"ซื้อของ",
    Salary:"เงินเดือน",
    Other:"อื่น ๆ"
  };
  return names[value] || value || "อื่น ๆ";
}

function formatDate(value) {
  if (!value) return "-";
  const parts = String(value).split("-");
  if (parts.length !== 3) return String(value);
  return parts[2] + "/" + parts[1] + "/" + (Number(parts[0]) + 543);
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeAttribute(value) {
  return escapeHtml(value);
}

function renderAll() {
  updateSummary();
  renderAnalysis();
  applyFilters();
}

/* =========================
   START
========================= */
initializeDatabase();
</script>
</body>
</html>
